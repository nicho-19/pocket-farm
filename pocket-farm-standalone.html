<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口袋田园</title>
  <style>
:root{
  /* 木棕深：主要文字、木牌与 toast。木棕浅：边框和木质层次。 */
  --wood-dark:#493a2a;--wood-light:#98704c;--wood-mid:#765438;
  /* 奶油底：页面卡片及深色表面的文字。 */
  --cream:#fff8e8;--cream-soft:#f4ead4;--cream-deep:#e8d9b9;
  /* 草绿：可操作按钮及春季状态。麦金：选中、焦点、金币。 */
  --grass:#315b39;--grass-light:#dce9c7;--wheat:#a96d21;--wheat-light:#f4d68b;
  /* 土褐：田园边线。危险红：错误与低生命。水蓝：雨天气象。 */
  --soil:#6a4931;--danger:#a3372b;--danger-light:#f7dfd7;--water:#286780;
  --line:#b79a71;--surface:#fffdf5;--sky:#e8f0dc;--white:#fff;
  --spring:#4c803c;--summer:#a35d20;--autumn:#86571a;--winter:#286780;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;
  --radius-sm:8px;--radius-md:12px;--radius-pill:999px;
  --shadow-low:0 3px 0 var(--wood-light);--shadow-high:0 8px 24px #493a2a33;
  --font-body:Verdana,"Microsoft YaHei",sans-serif;--font-display:Georgia,"Microsoft YaHei",serif;
  --text-xs:12px;--text-sm:14px;--text-md:16px;--text-lg:24px;
  --motion-panel:160ms;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,var(--sky),var(--cream-deep));color:var(--wood-dark);font:var(--text-md)/1.5 var(--font-body)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--wheat);outline-offset:3px}
.page{max-width:1390px;margin:auto;padding:var(--space-5)}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)}
.header-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:flex-end}
.eyebrow{color:var(--grass);font-size:var(--text-xs);font-weight:bold;letter-spacing:.08em}
h1{font:700 40px/1.1 var(--font-display);margin:var(--space-2) 0 0;color:var(--grass);letter-spacing:.04em}
h1 span{color:var(--wheat);font-size:27px}
h2{font-size:var(--text-md);margin:0;color:var(--wood-dark)}
.quiet-button{min-height:44px;background:var(--cream);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);box-shadow:var(--shadow-low)}
.quiet-button:hover,.shop-row button:hover{background:var(--grass-light)}
.status-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);background:var(--surface);border:2px solid var(--wood-light);border-bottom-width:4px;border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);box-shadow:var(--shadow-high)}
.status-group{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-3);min-width:0}
.status-group strong{font-size:var(--text-md);color:var(--wood-dark);white-space:nowrap}
.status-day>span:not(.season-dot){padding-left:var(--space-3);border-left:1px solid var(--line);font-size:var(--text-sm);color:var(--wood-dark)}
.season-dot{width:14px;height:14px;border-radius:50%;background:var(--spring);box-shadow:0 0 0 2px var(--cream),0 0 0 3px var(--wood-light)}
.season-dot[data-season="夏"]{background:var(--summer)}.season-dot[data-season="秋"]{background:var(--autumn)}.season-dot[data-season="冬"]{background:var(--winter)}
.gold-item{display:flex;align-items:center;gap:var(--space-2);white-space:nowrap}
.coin-icon{width:20px;height:18px;border:2px solid var(--wheat);border-radius:3px 3px 8px 8px;position:relative;background:var(--wheat-light)}
.coin-icon:before{content:"";position:absolute;top:-7px;left:4px;width:8px;height:5px;border:2px solid var(--wheat);border-radius:3px}
.health-item{min-width:220px;display:grid;grid-template-columns:auto auto 100px auto;align-items:center;gap:var(--space-2);font-size:var(--text-sm)}
.health-item b{font-weight:700;white-space:nowrap}
.health-track{height:15px;border:2px solid var(--wood-light);background:var(--cream-deep);border-radius:var(--radius-pill);overflow:hidden;position:relative}
.health-track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--wood-dark) calc(10% - 1px) 10%);opacity:.5;pointer-events:none}
.health-track div{height:100%;width:100%;background:var(--grass);transition:width .2s ease-out}
.low-health .health-track div{background:var(--danger);animation:health-pulse 1.1s ease-in-out infinite}
.low-health b:after{content:" · 低生命";color:var(--danger);font-weight:700}
@keyframes health-pulse{50%{opacity:.5}}
.main-grid{display:grid;grid-template-columns:minmax(0,768px) minmax(275px,1fr);gap:var(--space-5);align-items:start}
.scene-frame{position:relative;padding:7px;background:var(--cream);border:2px solid var(--wood-light);border-bottom-width:5px;border-radius:var(--radius-md);box-shadow:var(--shadow-high);line-height:0;touch-action:none}
.scene-frame canvas{display:block;width:100%;height:auto;image-rendering:auto;border-radius:4px;touch-action:none}
.tutorial-bubble{position:absolute;top:var(--space-4);left:50%;transform:translateX(-50%);width:max-content;max-width:85%;padding:var(--space-3) var(--space-4);border:2px solid var(--wood-light);border-radius:var(--radius-md);background:var(--cream);box-shadow:var(--shadow-high);line-height:1.5;text-align:center;font-size:var(--text-sm);font-weight:bold;pointer-events:none}
[hidden]{display:none!important}
.tool-panel,.side-card{background:var(--surface);border:2px solid var(--wood-light);border-bottom-width:4px;border-radius:var(--radius-md);padding:var(--space-4);margin-top:var(--space-4);box-shadow:var(--shadow-low)}
.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin:-16px -16px 12px;padding:var(--space-2) var(--space-4);background:var(--wood-mid);border-radius:9px 9px 0 0;min-height:44px}
.panel-heading h2{flex:1;text-align:center;color:var(--cream);font-size:var(--text-md)}
.panel-heading span{font-size:var(--text-xs);color:var(--cream)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}
.tool{position:relative;border:2px solid var(--line);border-radius:var(--radius-sm);background:var(--cream);padding:var(--space-2);min-height:56px;display:flex;align-items:center;justify-content:center;gap:var(--space-1);color:var(--wood-dark)}
.tool.active{border-color:var(--wheat);background:var(--wheat-light);box-shadow:0 0 0 2px var(--wheat);transform:scale(1.08);z-index:1;font-weight:bold}
.tool-icon{font-size:20px}.tool small{font-size:var(--text-xs)}
.tool-name{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--wood-dark);color:var(--cream);border-radius:var(--radius-sm);padding:var(--space-1) var(--space-2);font-size:var(--text-xs);opacity:0;pointer-events:none}
.tool.bump .tool-name{animation:tool-label .8s both}
@keyframes tool-label{0%,100%{opacity:0;transform:translate(-50%,4px)}15%,85%{opacity:1;transform:translate(-50%,0)}}
.tool-lock{position:absolute;right:0;top:0;width:44px;height:44px;border-radius:0 6px 0 6px;background:var(--wood-dark);color:var(--cream)}
.tool-lock:before{content:"";position:absolute;left:17px;top:9px;width:10px;height:11px;border:2px solid var(--cream);border-bottom:0;border-radius:8px 8px 0 0}
.tool-lock:after{content:"";position:absolute;left:14px;top:19px;width:17px;height:13px;background:var(--cream);border-radius:2px}
.crop-options{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);margin-top:var(--space-3)}
.crop-options>span{font-size:var(--text-sm)}
.crop-choice{border:1px solid var(--line);background:var(--cream);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-3);min-height:44px;font-size:var(--text-sm)}
.crop-choice.active{border-color:var(--wheat);background:var(--wheat-light);font-weight:bold}
.hint{min-height:44px;background:var(--grass-light);border:1px dashed var(--grass);border-radius:var(--radius-sm);padding:var(--space-3);font-size:var(--text-sm);margin:var(--space-3) 0 0}
.hint.error{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}
.sidebar .side-card:first-child{margin-top:0}
.intro-card{background:var(--grass-light)}
.intro-card h2{font:700 var(--text-lg)/1.3 var(--font-display);margin:var(--space-2) 0}
.intro-card .panel-heading h2{font:700 var(--text-md)/1.5 var(--font-body);margin:0;color:var(--cream)}
.intro-card p{font-size:var(--text-sm);margin:0 0 var(--space-3)}
.key-help{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:var(--space-2);font-size:var(--text-sm);margin-bottom:var(--space-4)}
kbd{background:var(--cream);border:1px solid var(--line);border-bottom-width:3px;border-radius:var(--radius-sm);padding:var(--space-1) var(--space-2);text-align:center;font:inherit}
.primary-button,.sell-button{width:100%;min-height:44px;background:var(--grass);color:var(--cream);border:0;border-bottom:4px solid var(--wood-dark);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-weight:bold}
.sell-button{margin-top:var(--space-3);background:var(--wood-mid)}
.primary-button:active,.sell-button:active{box-shadow:inset 0 3px 6px var(--wood-dark);transform:translateY(2px)}
.bag-list,.shop-list{display:flex;flex-direction:column}
.bag-row,.shop-row{display:flex;align-items:center;gap:var(--space-2);border-top:1px dashed var(--line);padding:var(--space-2) 0;font-size:var(--text-sm)}
.bag-row:first-child,.shop-row:first-child{border-top:0}
.bag-row{justify-content:space-between}.bag-row>span{display:flex;align-items:center;gap:var(--space-2)}
.crop-dot,.row-icon{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border:2px solid var(--wood-light);border-radius:var(--radius-sm);color:var(--wood-dark)}
.row-copy{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.row-copy small{font-size:var(--text-xs);color:var(--wood-dark)}
.row-price{min-width:50px;text-align:right;font-weight:bold;white-space:nowrap}.row-price.unaffordable{color:var(--danger)}
.shop-row button,.bag-row button,.order-row button,.tabs button{min-height:44px;border:1px solid var(--wood-light);border-radius:var(--radius-sm);background:var(--cream);padding:var(--space-2);font-size:var(--text-sm)}
.shop-row button.cant-afford{background:var(--cream-deep);color:var(--danger)}
.shop-row button:disabled{background:var(--cream-deep);color:var(--wood-dark);cursor:default}
.shop-highlight{background:var(--wheat-light);outline:2px solid var(--wheat);border-radius:var(--radius-sm)}
.touch-controls{display:none;justify-content:space-between;align-items:end;padding:var(--space-3) var(--space-1) 0;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:var(--space-1)}
.dpad button,.touch-use{min-width:56px;min-height:56px;border:2px solid var(--grass);border-bottom-width:5px;border-radius:var(--radius-md);background:var(--grass-light);color:var(--wood-dark);font-size:20px;font-weight:bold;touch-action:none;box-shadow:var(--shadow-low)}
.dpad button:active,.touch-use:active,.touch-use.is-pressed{box-shadow:inset 0 4px 7px var(--wood-light);transform:translateY(2px)}
.dpad [data-direction=up]{grid-column:2}.dpad [data-direction=left]{grid-column:1;grid-row:2}.dpad [data-direction=down]{grid-column:2;grid-row:2}.dpad [data-direction=right]{grid-column:3;grid-row:2}
.touch-use{position:relative;width:90px;height:90px;border-color:var(--wheat);background:var(--wheat-light)}
.use-progress{position:absolute;inset:5px;border-radius:50%;background:conic-gradient(var(--wheat) var(--use-progress),transparent var(--use-progress));mask:radial-gradient(transparent 58%,var(--wood-dark) 60%);pointer-events:none}
.modal{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--wood-dark) 67%,transparent);display:grid;place-items:center;padding:var(--space-4)}
.modal-card{width:min(590px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:3px solid var(--wood-light);border-radius:var(--radius-md);padding:var(--space-4);box-shadow:var(--shadow-high)}
.modal-heading{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;margin:-16px -16px 12px;background:var(--wood-mid);border-radius:8px 8px 0 0}
.modal-heading h2{color:var(--cream);text-align:center}
.close-button{position:absolute;right:var(--space-2);top:6px;width:36px;height:36px;border:2px solid var(--cream);border-radius:50%;background:var(--wood-dark);color:var(--cream);font-size:24px;line-height:1}
.modal-card p{font-size:var(--text-sm)}
.codex-row,.order-row{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:var(--space-3);border-top:1px dashed var(--line);padding:var(--space-2) 0;font-size:var(--text-sm)}
.codex-row canvas{width:48px;height:48px;image-rendering:auto}
.codex-row strong{display:block;font-size:var(--text-md)}
.order-row{display:flex;justify-content:space-between}
.tabs{display:flex;gap:var(--space-2);margin:var(--space-3) 0}
.log-card ul{padding:0;margin:0;list-style:none;max-height:150px;overflow:auto}
.log-card li{font-size:var(--text-sm);padding:var(--space-2) 0;border-top:1px dashed var(--line)}
.log-card li:first-child{border-top:0}.log-card li:before{content:"✦";color:var(--wheat);margin-right:var(--space-2)}
.toast-stack{position:fixed;bottom:calc(var(--space-5) + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:var(--space-2);width:min(410px,calc(100% - 24px));pointer-events:none}
.toast{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);background:var(--wood-dark);color:var(--cream);box-shadow:var(--shadow-high);font-size:var(--text-sm);animation:toast-in .2s ease-out both}
.toast.leaving{animation:toast-out .24s ease-in both}
.toast-icon{display:grid;place-items:center;flex:none;width:24px;height:24px;border:1px solid var(--cream);border-radius:50%;font-weight:bold}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toast-out{to{opacity:0;transform:translateY(-12px)}}
.season-banner{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;text-align:center;padding:var(--space-4);background:var(--grass);color:var(--cream);font:700 32px/1.2 var(--font-display);box-shadow:var(--shadow-high);pointer-events:none;animation:season-banner 1.92s both}
.season-banner[data-season="夏"]{background:var(--summer)}.season-banner[data-season="秋"]{background:var(--autumn)}.season-banner[data-season="冬"]{background:var(--winter)}
@keyframes season-banner{0%{opacity:0;transform:translateY(-100%)}8.3%,91.7%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-100%)}}
.modal-open .touch-controls{visibility:hidden}
.modal:not([hidden]) .modal-card{animation:panel-enter var(--motion-panel) ease-out both}
@keyframes panel-enter{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.modal.closing:not([hidden]) .modal-card{animation:panel-exit var(--motion-panel) ease-in both}
@keyframes panel-exit{to{opacity:0;transform:scale(.98)}}
.tool.bump .tool-icon{animation:tool-bump .28s ease-out}
@keyframes tool-bump{50%{transform:translateY(-5px) scale(1.12)}}
footer{text-align:center;font-size:var(--text-xs);padding:var(--space-5) 0}
@media(max-width:1000px){.main-grid{grid-template-columns:minmax(0,1fr) 280px}.page{padding:var(--space-4)}.tool{flex-direction:column}}
@media(max-width:760px){.main-grid{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}.sidebar .side-card{margin:0}.touch-controls{display:flex}}
@media(max-width:520px){.page{padding:var(--space-3)}.masthead{flex-wrap:wrap}h1{font-size:30px}.header-actions .quiet-button{font-size:var(--text-xs)}.status-bar{padding:var(--space-3)}.status-day,.status-resources{width:100%;justify-content:space-between}.status-day>span:not(.season-dot){padding-left:var(--space-2)}.health-item{grid-template-columns:auto 95px}.sidebar{display:block}.sidebar .side-card{margin-top:var(--space-3)}.tool{font-size:var(--text-xs)}.shop-row{flex-wrap:wrap}.row-copy{flex-basis:45%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.season-banner{animation:season-fade 1.92s both;animation-duration:1.92s!important}@keyframes season-fade{0%,100%{opacity:0}8.3%,91.7%{opacity:1}}}

#raid-forecast.danger{color:var(--danger);font-weight:bold;background:var(--danger-light);border-radius:var(--radius-sm)}
.build-panel{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);margin-top:var(--space-3);padding:var(--space-2);background:var(--grass-light);border-radius:var(--radius-sm)}
.build-panel[hidden],.confirm-bar[hidden]{display:none}
.build-panel button,.confirm-bar button{min-height:44px;border:1px solid var(--wood-light);border-radius:var(--radius-sm);background:var(--cream);padding:var(--space-2)}
.build-panel span{font-size:var(--text-sm)}
.quantity-control{display:flex;align-items:center;gap:var(--space-1)}
.quantity-control button{min-width:44px}
.bag-value{padding:var(--space-2);font-weight:bold}
.confirm-bar{position:fixed;bottom:var(--space-3);left:50%;transform:translateX(-50%);z-index:30;width:min(92vw,620px);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-3);background:var(--cream);border:2px solid var(--wood-light);border-radius:var(--radius-md);box-shadow:var(--shadow-high)}
.home-alert{outline:3px solid var(--danger);font-weight:bold}
@media(prefers-reduced-motion:no-preference){.home-alert{animation:home-pulse 1.5s ease-in-out infinite}@keyframes home-pulse{50%{box-shadow:0 0 0 5px var(--danger-light)}}}

.crop-choice{position:relative}.buy-badge{display:inline-block;margin-left:var(--space-1);padding:2px 5px;border-radius:var(--radius-sm);background:var(--wheat-light);color:var(--wood-dark);font-size:var(--text-xs)}
.bag-row{flex-wrap:wrap}.bag-row button{min-height:44px}
.watch-button{width:100%;margin-top:8px}.watch-button:disabled{opacity:.55;cursor:default}.watch-mode .scene-frame{box-shadow:0 0 24px #485eac}.weapon-hud{font-weight:bold;color:var(--wood-dark)}
.game-over-card{text-align:center}.game-over-card h2{color:var(--danger);font-size:var(--text-lg)}.game-over-card p{margin:24px 0;font-size:var(--text-md)}
#villager-gifts button{min-height:44px;margin:4px;border:1px solid var(--wood-light);border-radius:var(--radius-sm);background:var(--cream);padding:8px}#villager-gifts button:disabled{opacity:.55}

.health-item>span:first-child{color:var(--danger);font-size:21px}.health-item>button{min-width:44px;min-height:44px;border:1px solid var(--wood-light);border-radius:var(--radius-sm);background:var(--cream)}
@media(prefers-reduced-motion:reduce){.low-health .health-track div{animation:none}}

</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div><span class="eyebrow">一方小田 · 四季慢生活</span><h1>口袋田园 <span>✿</span></h1></div>
      <div class="header-actions"><button id="go-home" class="quiet-button" type="button">⌂ 回家</button><button id="mute" class="quiet-button" type="button" aria-pressed="false">🔊 音效</button><button id="orders-button" class="quiet-button" type="button">订单</button><button id="codex" class="quiet-button" type="button">图鉴</button><button id="new-game" class="quiet-button" type="button">新游戏</button></div>
    </header>
    <section class="status-bar" aria-label="农场状态">
      <div class="status-group status-day"><span id="season-dot" class="season-dot" aria-hidden="true"></span><strong id="date"></strong><span id="weather"></span><span id="tomorrow"></span><span id="raid-forecast" aria-live="polite"></span></div>
      <div class="status-group status-resources"><div class="gold-item"><span class="coin-icon" aria-hidden="true"></span><span>金币</span><strong id="gold"></strong></div><span id="weapon-hud" class="weapon-hud"></span><div id="health-item" class="health-item"><span aria-hidden="true">♥</span><span>生命 <b id="health-text"></b></span><div class="health-track" aria-hidden="true"><div id="health-fill"></div></div><button id="quick-eat" type="button" aria-label="快捷吃背包中回血最多的食物">吃</button></div></div>
    </section>
    <main class="main-grid">
      <section class="play-area" aria-label="农场">
        <div class="scene-frame"><canvas id="farm" width="768" height="576" aria-label="口袋田园农场画面"></canvas><div id="tutorial" class="tutorial-bubble" role="status" hidden></div></div>

  </div>
  <div id="home-confirm" class="confirm-bar" hidden>已到家门口 <button id="home-sleep" type="button">睡觉</button><button id="home-watch" type="button">守夜</button><button id="home-cancel" type="button">再逛逛</button></div><div id="sell-confirm" class="confirm-bar" hidden><span id="sell-confirm-text"></span><button id="sell-confirm-yes" type="button">确认卖出</button><button id="sell-confirm-no" type="button">取消</button></div><div id="season-banner" class="season-banner" role="status" aria-live="polite" hidden></div>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="codex-panel" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="作物图鉴"><div class="modal-heading"><h2>图鉴与统计</h2><button id="close-codex" class="close-button" type="button" aria-label="关闭图鉴">×</button></div><div class="tabs"><button id="crop-tab" type="button">作物</button><button id="stats-tab" type="button">统计</button></div><div id="codex-list"></div><div id="stats-list" hidden></div></div></div>
  <div id="orders-panel" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="订单板"><div class="modal-heading"><h2>今日订单</h2><button id="close-orders" class="close-button" type="button" aria-label="关闭订单板">×</button></div><div id="orders-list"></div></div></div>
  <div id="villager-panel" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="村民对话"><div class="modal-heading"><h2 id="villager-title"></h2><button id="close-villager" class="close-button" type="button" aria-label="关闭对话">×</button></div><p id="villager-line"></p><div id="villager-content"></div><h3>送一份作物</h3><div id="villager-gifts"></div></div></div>
  <div id="game-over" class="modal" hidden><div class="modal-card game-over-card" role="dialog" aria-modal="true" aria-label="游戏结束"><h2>农夫倒下了</h2><p id="game-over-stats"></p><button id="restart" class="primary-button" type="button">重新开始</button></div></div>
  <script>
(function (root) {
  'use strict';

  const WIDTH = 20;
  const HEIGHT = 14;
  const HEALTH_MAX = 100;
  const RAIN_CHANCE = { '春': 0.30, '夏': 0.40, '秋': 0.25, '冬': 0.20 };
  const SEASONS = ['春', '夏', '秋', '冬'];
  const CROPS = {
    carrot: { name: '萝卜', days: 3, seedPrice: 10, sellPrice: 25 },
    potato: { name: '土豆', days: 4, seedPrice: 18, sellPrice: 48 },
    pumpkin: { name: '南瓜', days: 5, seedPrice: 30, sellPrice: 85 },
    strawberry: { name: '草莓', days: 4, seedPrice: 30, sellPrice: 81 },
    corn: { name: '玉米', days: 3, seedPrice: 15, sellPrice: 38 }
  };
  const TOOLS = {
    hoe: { name: '锄头' },
    seed: { name: '种子' },
    scythe: { name: '镰刀' },
    build: { name: '建造' }
  };
  const DIRECTIONS = {
    up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]
  };
  const BUILDINGS = { scarecrow: { name: '稻草人', price: 150 }, fence: { name: '木栅栏', price: 40 } };
  const FOOD_HEAL = { carrot: 6, potato: 8, corn: 8, strawberry: 10, pumpkin: 14, snack: 20 };
  const WEAPONS = { none: { name: '徒手', price: 0, damage: 0, counter: 0 }, club: { name: '木棍', price: 100, damage: 1, counter: 0.30 }, axe: { name: '石斧', price: 300, damage: 2, counter: 0.55 }, sword: { name: '铁剑', price: 800, damage: 3, counter: 0.80 } };
  const LAYOUT = {
    home: { x: 1, y: 1 }, homeDoor: { x: 1, y: 2 },
    huts: [{ x: 3, y: 1 }, { x: 5, y: 1 }, { x: 6, y: 1 }],
    square: { x: 3, y: 3 }, farm: { left: 4, top: 4, right: 15, bottom: 12 },
    oldPlots: { x: 4, y: 4, width: 12, height: 9 },
    pond: { left: 16, top: 9, right: 18, bottom: 12 },
    woods: { left: 8, top: 0, right: 19, bottom: 2, pathX: 13 },
    gate: { x: 10, y: 13 }, raidSpawns: [{ x: 9, y: 3 }, { x: 13, y: 3 }, { x: 18, y: 3 }]
  };
  const VILLAGERS = { mayor: { name: '村长', points: [[2, 2], [2, 3], [3, 3]], gift: '100G' }, merchant: { name: '商人婆婆', points: [[4, 2], [4, 3], [3, 3]], gift: '饭团×2' }, hunter: { name: '小猎手', points: [[6, 2], [6, 3], [5, 3]], gift: '木栅栏×2' } };
  function inArea(x, y, area) { return x >= area.left && x <= area.right && y >= area.top && y <= area.bottom; }
  function terrainAt(x, y) {
    if (!inBounds(x, y)) return 'outside';
    if (x === LAYOUT.home.x && y === LAYOUT.home.y || LAYOUT.huts.some(hut => hut.x === x && hut.y === y)) return 'house';
    if (inArea(x, y, LAYOUT.pond)) return 'pond';
    if (inArea(x, y, LAYOUT.woods) && x !== LAYOUT.woods.pathX) return 'tree';
    if (inArea(x, y, LAYOUT.woods)) return 'path';
    if (inArea(x, y, LAYOUT.farm)) return 'farm';
    if (x <= 6 && y <= 4) return 'residential';
    return 'grass';
  }
  function canWalk(state, x, y) { return inBounds(x, y) && !['house', 'pond', 'tree'].includes(terrainAt(x, y)) && state.plots[y][x].structure !== 'fence'; }
  function validRaid(raid) {
    return raid && ['calm', 'raid', 'large'].includes(raid.level) &&
      Number.isInteger(raid.count) && raid.count >= 0 && raid.count <= 6 &&
      (raid.level === 'calm' || (Array.isArray(raid.attackers) && raid.attackers.length === raid.count && raid.attackers.every(kind => kind === 'crow' || kind === 'bandit' || kind === 'boar')));
  }
  function planRaid(day, random) {
    if (day <= 2) return { level: 'calm', count: 0 };
    const large = day % 7 === 0;
    if (!large && random() >= 0.45) return { level: 'calm', count: 0 };
    const count = Math.min((1 + Math.floor(day / 10)) * (large ? 2 : 1), large ? 6 : 4);
    return { level: large ? 'large' : 'raid', count, attackers: Array.from({ length: count }, () => random() < 0.5 ? 'crow' : 'bandit') };
  }

  function makePlot() {
    return { tilled: false, crop: null, structure: null };
  }

  function cropCounts() {
    return Object.fromEntries(Object.keys(CROPS).map(key => [key, 0]));
  }

  function createGame() {
    return {
      version: 6,
      day: 1,
      weather: 'sunny',
      tomorrow: 'sunny',
      gold: 100,
      health: HEALTH_MAX,
      weapon: 'none',
      gameOver: false,
      villagers: Object.fromEntries(Object.keys(VILLAGERS).map(id => [id, { hearts: 0, giftedDay: 0, rewarded: false }])),
      fenceStock: 0,
      farmer: { x: 5, y: 3, facing: 'down' },
      tool: 'hoe',
      selectedCrop: 'carrot',
      seeds: { ...cropCounts(), carrot: 3 },
      bag: cropCounts(),
      snacks: 0,
      nightRaid: { level: 'calm', count: 0 },
      orders: [],
      nextOrderId: 1,
      stats: { income: 0, harvested: 0, orders: 0, days: 0, repelled: 0 },
      manualTool: false,
      tutorial: 0,
      plots: Array.from({ length: HEIGHT }, () => Array.from({ length: WIDTH }, makePlot))
    };
  }

  function migrateSave(saved) {
    const legacy = saved?.version <= 5 && Array.isArray(saved.plots) &&
      saved.plots.length === LAYOUT.oldPlots.height &&
      saved.plots.every(row => Array.isArray(row) && row.length === LAYOUT.oldPlots.width);
    if (!saved || ![1, 2, 3, 4, 5, 6].includes(saved.version) ||
        !Array.isArray(saved.plots) ||
        !((saved.plots.length === HEIGHT && saved.plots.every(row => Array.isArray(row) && row.length === WIDTH)) || legacy) ||
        !saved.farmer || !(legacy ? saved.farmer.x >= 0 && saved.farmer.x < LAYOUT.oldPlots.width && saved.farmer.y >= 0 && saved.farmer.y < LAYOUT.oldPlots.height : inBounds(saved.farmer.x, saved.farmer.y)) ||
        !DIRECTIONS[saved.farmer.facing] || !(TOOLS[saved.tool] || saved.tool === 'water') ||
        !CROPS[saved.selectedCrop] || !Number.isFinite(saved.day) ||
        !Number.isFinite(saved.gold)) return null;
    if (legacy) {
      const plots = Array.from({ length: HEIGHT }, () => Array.from({ length: WIDTH }, makePlot));
      for (let y = 0; y < LAYOUT.oldPlots.height; y++) for (let x = 0; x < LAYOUT.oldPlots.width; x++)
        plots[LAYOUT.oldPlots.y + y][LAYOUT.oldPlots.x + x] = saved.plots[y][x];
      saved.plots = plots;
      saved.farmer = { ...saved.farmer, ...LAYOUT.homeDoor };
    }
    delete saved.energy;
    saved.health = Number.isFinite(saved.health) ? Math.max(0, Math.min(HEALTH_MAX, saved.health)) : HEALTH_MAX;
    saved.weapon = WEAPONS[saved.weapon] ? saved.weapon : 'none';
    saved.gameOver = !!saved.gameOver || saved.health <= 0;
    saved.villagers = Object.fromEntries(Object.keys(VILLAGERS).map(id => {
      const old = saved.villagers?.[id] || {};
      return [id, { hearts: Math.max(0, Math.min(5, Number.isInteger(old.hearts) ? old.hearts : 0)), giftedDay: Number.isInteger(old.giftedDay) ? old.giftedDay : 0, rewarded: !!old.rewarded }];
    }));
    saved.fenceStock = Number.isInteger(saved.fenceStock) && saved.fenceStock >= 0 ? saved.fenceStock : 0;
    saved.seeds = { ...cropCounts(), ...saved.seeds };
    saved.bag = { ...cropCounts(), ...saved.bag };
    for (const row of saved.plots) {
      for (const plot of row) {
        if (!plot || typeof plot !== 'object' ||
            (plot.crop && !CROPS[plot.crop.type])) return null;
      }
    }
    saved.tomorrow = saved.tomorrow === 'rain' ? 'rain' : 'sunny';
    saved.snacks = Number.isInteger(saved.snacks) && saved.snacks >= 0 ? saved.snacks : 0;
    const refund = !!saved.upgrades?.water;
    const hoeRefund = saved.version <= 4 && !!saved.upgrades?.hoe;
    delete saved.upgrades;
    if (refund) {
      saved.gold += 600;
      saved.migrationEvents = [...(Array.isArray(saved.migrationEvents) ? saved.migrationEvents : []), '水壶已回收，返还 600G'];
    }
    if (hoeRefund) {
      saved.gold += 400;
      saved.migrationEvents = [...(Array.isArray(saved.migrationEvents) ? saved.migrationEvents : []), '精钢锄已回收，返还 400G'];
    }
    if (saved.tool === 'water') saved.tool = 'hoe';
    for (const row of saved.plots) for (const plot of row) {
      delete plot.watered;
      if (plot.structure !== 'scarecrow' && plot.structure !== 'fence') plot.structure = null;
    }
    saved.nightRaid = validRaid(saved.nightRaid) ? saved.nightRaid : { level: 'calm', count: 0 };
    if (saved.nightRaid.attackers) saved.nightRaid.attackers = saved.nightRaid.attackers.map(kind => kind === 'boar' ? 'bandit' : kind);
    saved.orders = Array.isArray(saved.orders) ? saved.orders.filter(order => CROPS[order.crop] && Number.isInteger(order.amount) && order.amount > 0 && Number.isInteger(order.deadline) && Number.isInteger(order.reward)).map(order => ({ ...order, accepted: order.accepted !== false })) : [];
    saved.nextOrderId = Number.isInteger(saved.nextOrderId) ? saved.nextOrderId : 1;
    saved.stats = { income: 0, harvested: 0, orders: 0, days: 0, repelled: 0, ...saved.stats };
    saved.manualTool = !!saved.manualTool;
    saved.tutorial = Number.isInteger(saved.tutorial) && saved.tutorial >= 0 && saved.tutorial <= 2 ? saved.tutorial : 2;
    saved.version = 6;
    return saved;
  }

  function season(state) {
    return SEASONS[Math.floor((state.day - 1) / 28) % SEASONS.length];
  }

  function seasonDay(state) {
    return ((state.day - 1) % 28) + 1;
  }

  function frontCell(state) {
    const offset = DIRECTIONS[state.farmer.facing];
    return { x: state.farmer.x + offset[0], y: state.farmer.y + offset[1] };
  }

  function inBounds(x, y) {
    return x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;
  }
  function cameraTarget(farmer, viewportWidth, viewportHeight, tile = 48) {
    const axis = (position, count, view) => count * tile <= view ? (count * tile - view) / 2 :
      Math.max(0, Math.min(count * tile - view, (position + 0.5) * tile - view / 2));
    return { x: axis(farmer.x, WIDTH, viewportWidth), y: axis(farmer.y, HEIGHT, viewportHeight) };
  }
  function cameraStep(current, target, elapsed) {
    const alpha = 1 - Math.exp(-Math.max(0, elapsed) / 120);
    return { x: current.x + (target.x - current.x) * alpha, y: current.y + (target.y - current.y) * alpha };
  }
  function screenToCell(clientX, clientY, rect, camera, viewportWidth, viewportHeight, tile = 48) {
    return { x: Math.floor(((clientX - rect.left) / rect.width * viewportWidth + camera.x) / tile),
      y: Math.floor(((clientY - rect.top) / rect.height * viewportHeight + camera.y) / tile) };
  }

  function result(ok, message, events) {
    return { ok, message, events: events || (ok ? [message] : []) };
  }

  function move(state, direction) {
    if (!DIRECTIONS[direction]) return result(false, '无效方向');
    state.farmer.facing = direction;
    const [dx, dy] = DIRECTIONS[direction];
    const x = state.farmer.x + dx;
    const y = state.farmer.y + dy;
    if (!inBounds(x, y)) return result(false, '农场边界，不能再往前走了');
    if (!canWalk(state, x, y) && state.plots[y][x].structure !== 'fence') return result(false, '地物挡住了路');
    if (state.plots[y][x].structure === 'fence') return result(false, '木栅栏挡住了路');
    state.farmer.x = x;
    state.farmer.y = y;
    return result(true, '移动', []);
  }

  function selectTool(state, tool) {
    if (!TOOLS[tool]) return result(false, '无效工具');
    state.tool = tool;
    state.manualTool = true;
    return result(true, `已选择${TOOLS[tool].name}`, []);
  }

  function selectCrop(state, crop) {
    if (!CROPS[crop]) return result(false, '无效作物');
    state.selectedCrop = crop;
    return result(true, `已选择${CROPS[crop].name}种子`, []);
  }

  function act(state, smart) {
    const { x, y } = frontCell(state);
    if (!inBounds(x, y)) return result(false, '前方没有地块');
    const plot = state.plots[y][x];
    let tool = state.tool;
    if (smart && !state.manualTool) {
      if (plot.crop && plot.crop.progress >= CROPS[plot.crop.type].days) tool = 'scythe';
      else if (plot.tilled && !plot.crop && state.seeds[state.selectedCrop] > 0) tool = 'seed';
      else if (!plot.tilled) tool = 'hoe';
    }
    const crop = state.selectedCrop;

    let message;
    if (tool === 'hoe') {
      if (terrainAt(x, y) !== 'farm') return result(false, '这里只能在农田区开垦');
      if (plot.structure) return result(false, '这里有防御道具');
      if (plot.tilled) return result(false, '这块地已经开垦过了');
      plot.tilled = true;
      message = '开垦了一块田地';
    } else if (tool === 'seed') {
      if (plot.structure) return result(false, '这里有防御道具');
      if (!plot.tilled) return result(false, '先用锄头开垦土地');
      if (plot.crop) return result(false, '这块地已经有作物了');
      if (state.seeds[crop] < 1) return result(false, `${CROPS[crop].name}种子不够，去商店购买`);
      state.seeds[crop]--;
      plot.crop = { type: crop, progress: 0 };
      message = `播下${CROPS[crop].name}种子`;
    } else if (tool === 'scythe') {
      if (plot.structure) {
        const name = plot.structure === 'fence' ? '木栅栏' : '稻草人';
        plot.structure = null;
        return { ...result(true, `回收了${name}（不返金币）`), tool };
      }
      if (!plot.crop) return result(false, '这里没有作物');
      const planted = plot.crop;
      if (planted.progress < CROPS[planted.type].days) return result(false, '作物还没有成熟');
      state.bag[planted.type]++;
      state.stats.harvested++;
      plot.crop = null;
      message = `收获了${CROPS[planted.type].name}，已放入背包`;
    } else if (tool === 'build') {
      return result(false, '请先在建造面板选择道具');
    }
    return { ...result(true, message), tool };
  }

  function buySeed(state, crop, amount) {
    if (!CROPS[crop] || !Number.isInteger(amount) || amount < 1) return result(false, '购买数量无效');
    const price = CROPS[crop].seedPrice * amount;
    if (state.gold < price) return result(false, '金币不够');
    state.gold -= price;
    state.seeds[crop] += amount;
    return result(true, `购买了 ${amount} 包${CROPS[crop].name}种子，花费 ${price} G，余额 ${state.gold} G`);
  }
  function placeBuilding(state, kind) {
    if (!BUILDINGS[kind]) return result(false, '无效建造道具');
    const { x, y } = frontCell(state);
    if (!inBounds(x, y)) return result(false, '前方没有地块');
    const plot = state.plots[y][x];
    if (!['farm', 'residential'].includes(terrainAt(x, y))) return result(false, '这里只能在农田或住宅空地建造');
    if (plot.tilled || plot.crop || plot.structure) return result(false, '只能放在空草地上');
    const price = BUILDINGS[kind].price;
    const free = kind === 'fence' && state.fenceStock > 0;
    if (free) state.fenceStock--;
    else {
      if (state.gold < price) return result(false, `金币不足，还差 ${price - state.gold} G`);
      state.gold -= price;
    }
    plot.structure = kind;
    return result(true, `放置了${BUILDINGS[kind].name}${free ? '，使用库存' : `，花费 ${price} G`}`);
  }

  function giftVillager(state, id, crop) {
    if (!VILLAGERS[id] || !CROPS[crop]) return result(false, '送礼目标无效');
    const villager = state.villagers[id];
    if (villager.giftedDay === state.day) return result(false, '今天已经送过这位村民了');
    if (state.bag[crop] < 1) return result(false, '背包里没有这份作物');
    state.bag[crop]--; villager.giftedDay = state.day;
    villager.hearts = Math.min(5, villager.hearts + 1);
    const events = [`送给${VILLAGERS[id].name}一份${CROPS[crop].name}，好感 ${villager.hearts}/5`];
    if (villager.hearts === 5 && !villager.rewarded) {
      villager.rewarded = true;
      if (id === 'mayor') state.gold += 100;
      if (id === 'merchant') state.snacks += 2;
      if (id === 'hunter') state.fenceStock += 2;
      events.push(`${VILLAGERS[id].name}回礼：${VILLAGERS[id].gift}`);
    }
    return { ...result(true, events[0], events), rewarded: villager.rewarded };
  }

  function villagerLine(state, id, turn = 0) {
    const common = {
      mayor: ['庄稼长得不错。', '订单板上有新活。', '雨天别忘了看看作物。', '村里人都盼着丰收。', '慢慢来，地会给你回报。', '昨夜的战报我看过了。'],
      merchant: ['新鲜种子在这边。', '富余的收成可以卖给我。', '饭团能救急。', '好武器能护住粮仓。', '四季都有好生意。', '昨夜可把我吓坏了。'],
      hunter: ['今晚我会留意林边。', '木棍也比徒手强。', '强盗怕有准备的人。', '栅栏能替你挡一回。', '别让血量见底。', '昨晚的脚印还在呢。']
    };
    if (turn % 6 === 0) return state.nightRaid.level === 'large' ? '今晚大入侵将至，务必当心！' : `今晚${state.nightRaid.attackers?.filter(kind => kind === 'bandit').length || 0}名强盗可能来。`;
    if (turn % 6 === 1) return `${season(state)}季${state.weather === 'rain' ? '下雨' : '晴朗'}，田里的节奏变了。`;
    return common[id][turn % 6];
  }

  function orderReserve(state, crop) {
    return state.orders.filter(order => order.crop === crop && order.accepted !== false).reduce((sum, order) => sum + order.amount, 0);
  }
  function salePreview(state) {
    let total = 0, count = 0;
    for (const [key, crop] of Object.entries(CROPS)) {
      const amount = Math.max(0, state.bag[key] - orderReserve(state, key));
      count += amount;
      total += amount * crop.sellPrice;
    }
    return { total, count };
  }
  function sellCrop(state, crop, amount) {
    if (!CROPS[crop] || !Number.isInteger(amount) || amount < 1 || state.bag[crop] < amount) return result(false, '卖出数量无效');
    const warning = state.bag[crop] - amount < orderReserve(state, crop);
    const total = amount * CROPS[crop].sellPrice;
    state.bag[crop] -= amount;
    state.gold += total;
    state.stats.income += total;
    return { ...result(true, `卖出 ${amount} 份${CROPS[crop].name}，获得 ${total} G`), warning };
  }
  function sellAll(state) {
    const { total, count } = salePreview(state);
    if (!count) return result(false, '背包里没有可卖的富余作物');
    for (const key of Object.keys(CROPS)) state.bag[key] = Math.min(state.bag[key], orderReserve(state, key));
    state.gold += total;
    state.stats.income += total;
    return result(true, `卖出 ${count} 份收获，获得 ${total} G，已保留订单所需作物`);
  }

  function buySnack(state) {
    if (state.gold < 20) return result(false, '金币不够');
    state.gold -= 20;
    state.snacks++;
    return result(true, '买了一个饭团');
  }

  function buyWeapon(state, weapon) {
    if (!WEAPONS[weapon] || weapon === 'none') return result(false, '无效武器');
    if (WEAPONS[weapon].damage <= WEAPONS[state.weapon].damage) return result(false, '已持有同级或更强武器');
    const price = WEAPONS[weapon].price;
    if (state.gold < price) return result(false, `金币不足，还差 ${price - state.gold} G`);
    state.gold -= price;
    state.weapon = weapon;
    return result(true, `购买${WEAPONS[weapon].name}，花费 ${price} G；旧武器未退款`);
  }

  function eatFood(state, food) {
    if (!FOOD_HEAL[food]) return result(false, '无效食物');
    if (!(food === 'snack' ? state.snacks : state.bag[food])) return result(false, '背包里没有这种食物');
    if (state.health >= HEALTH_MAX) return result(false, '生命已满，别浪费粮食');
    if (food === 'snack') state.snacks--;
    else state.bag[food]--;
    const restored = Math.min(FOOD_HEAL[food], HEALTH_MAX - state.health);
    state.health += restored;
    return result(true, `吃${food === 'snack' ? '饭团' : CROPS[food].name}恢复了 ${restored} 点生命`);
  }
  function quickEat(state) {
    const food = Object.keys(FOOD_HEAL).filter(key => key === 'snack' ? state.snacks : state.bag[key]).sort((a, b) => FOOD_HEAL[b] - FOOD_HEAL[a])[0];
    return food ? eatFood(state, food) : result(false, '背包里没有食物');
  }

  function generateOrders(state, random) {
    const roll = random || Math.random;
    const available = Object.keys(CROPS).filter(key => CROPS[key].seedPrice <= Math.max(30, state.gold + 20));
    const count = 1 + Math.floor(roll() * 3);
    state.orders = Array.from({ length: count }, () => {
      const crop = available[Math.floor(roll() * available.length)];
      const amount = 1; // 一块地的一茬收获一份。
      return { id: state.nextOrderId++, crop, amount, deadline: state.day + 2 + Math.floor(roll() * 3), reward: Math.round(CROPS[crop].sellPrice * amount * 1.5) + 5 + Math.floor(roll() * 11), accepted: false };
    });
    return state.orders;
  }

  function acceptOrder(state, id) {
    const order = state.orders.find(item => item.id === id);
    if (!order || state.day > order.deadline) return result(false, '订单已失效');
    if (order.accepted) return result(false, '已经接过这份订单');
    order.accepted = true;
    return result(true, `接下${CROPS[order.crop].name}订单`);
  }

  function deliverOrder(state, id) {
    const index = state.orders.findIndex(order => order.id === id);
    if (index < 0) return result(false, '订单已失效');
    const order = state.orders[index];
    if (order.accepted === false) return result(false, '请先接下订单');
    if (state.day > order.deadline) return result(false, '订单已过期');
    if (state.bag[order.crop] < order.amount) return result(false, '背包里的作物不够');
    state.bag[order.crop] -= order.amount;
    state.gold += order.reward;
    state.stats.income += order.reward;
    state.stats.orders++;
    state.orders.splice(index, 1);
    return result(true, `交付${CROPS[order.crop].name}订单，获得 ${order.reward} G`);
  }

  function findPath(state, targetX, targetY, from = state.farmer, adjacent = true) {
    if (!inBounds(targetX, targetY)) return null;
    const queue = [{ x: from.x, y: from.y, path: [] }];
    const seen = new Set([`${from.x},${from.y}`]);
    for (let i = 0; i < queue.length; i++) {
      const node = queue[i];
      if (adjacent ? Math.abs(node.x - targetX) + Math.abs(node.y - targetY) === 1 : node.x === targetX && node.y === targetY) return node.path;
      for (const [direction, [dx, dy]] of Object.entries(DIRECTIONS)) {
        const x = node.x + dx, y = node.y + dy, key = `${x},${y}`;
        if (canWalk(state, x, y) && !seen.has(key)) {
          seen.add(key);
          queue.push({ x, y, path: [...node.path, direction] });
        }
      }
    }
    return null;
  }

  function pathBetween(state, from, to) {
    return findPath(state, to.x, to.y, from, false);
  }

  function startWatch(state, now = 0) {
    const count = state.nightRaid.attackers?.filter(kind => kind === 'bandit').length || 0;
    if (!count) return null;
    return { count, spawned: 0, defeated: 0, enemies: [], started: now, lastMove: now, lastAttack: -Infinity, invulnerableUntil: 0, success: false };
  }

  function watchStrike(state, battle, now = 0) {
    const cell = frontCell(state);
    const enemy = battle.enemies.find(item => !item.retreating && item.x === cell.x && item.y === cell.y);
    if (!enemy) return result(false, '前方没有强盗');
    const damage = WEAPONS[state.weapon].damage;
    if (!damage) {
      const [dx, dy] = DIRECTIONS[state.farmer.facing];
      const x = enemy.x + dx, y = enemy.y + dy;
      if (canWalk(state, x, y)) { enemy.x = x; enemy.y = y; }
      return result(true, '徒手推开强盗一格');
    }
    enemy.health -= damage;
    if (enemy.health <= 0) {
      enemy.retreating = true; enemy.retreatNext = now; battle.defeated++; state.stats.repelled++;
      return result(true, `击退强盗！剩余 ${battle.count - battle.defeated} 人`);
    }
    return result(true, `击中强盗，造成 ${damage} 点伤害`);
  }

  function watchTick(state, battle, now) {
    if (battle.spawned < battle.count && now - battle.started >= battle.spawned * 2000) {
      const edges = LAYOUT.raidSpawns;
      const edge = edges.slice(battle.spawned % 4).concat(edges.slice(0, battle.spawned % 4)).find(cell => state.plots[cell.y][cell.x].structure !== 'fence') || edges[battle.spawned % 4];
      battle.enemies.push({ ...edge, health: 3, retreating: false }); battle.spawned++;
    }
    for (const enemy of battle.enemies) if (enemy.retreating && now >= enemy.retreatNext) {
      enemy.x += enemy.x < WIDTH / 2 ? -1 : 1;
      enemy.retreatNext = now + 120;
    }
    battle.enemies = battle.enemies.filter(enemy => !enemy.retreating || (enemy.x >= 0 && enemy.x < WIDTH));
    if (battle.defeated === battle.count && battle.spawned === battle.count && !battle.enemies.length) battle.success = true;
    if (now - battle.lastMove >= 500) {
      for (const enemy of battle.enemies) {
        if (enemy.retreating) continue;
        const targets = [state.farmer];
        if (!state.plots[enemy.y]?.[enemy.x]?.crop) for (let y = 0; y < HEIGHT; y++) for (let x = 0; x < WIDTH; x++) if (state.plots[y][x].crop) targets.push({ x, y });
        const paths = targets.map(target => pathBetween(state, enemy, target)).filter(path => path?.length).sort((a, b) => a.length - b.length);
        const step = paths[0]?.[0];
        if (step && Math.abs(enemy.x - state.farmer.x) + Math.abs(enemy.y - state.farmer.y) > 1) {
          enemy.x += DIRECTIONS[step][0]; enemy.y += DIRECTIONS[step][1];
        } else if (!step) {
          for (const [dx, dy] of Object.values(DIRECTIONS)) {
            const x = enemy.x + dx, y = enemy.y + dy;
            if (inBounds(x, y) && state.plots[y][x].structure === 'fence') { state.plots[y][x].structure = null; break; }
          }
        }
      }
      battle.lastMove = now;
    }
    if (now - battle.lastAttack >= 1000 && now >= battle.invulnerableUntil && battle.enemies.some(enemy => !enemy.retreating && Math.abs(enemy.x - state.farmer.x) + Math.abs(enemy.y - state.farmer.y) <= 1)) {
      state.health = Math.max(0, state.health - 4);
      battle.lastAttack = now; battle.invulnerableUntil = now + 500;
      return result(true, '强盗近身，农夫失去 4 HP');
    }
    return result(true, '', []);
  }

  function protectedByScarecrow(state, x, y) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (state.plots[y + dy]?.[x + dx]?.structure === 'scarecrow') return true;
    }
    return false;
  }

  function raidDistance(state, targetX, targetY) {
    const origin = state.farmer;
    state.farmer = { ...LAYOUT.raidSpawns[0], facing: 'down' };
    const path = findPath(state, targetX, targetY);
    state.farmer = origin;
    return path ? path.length : Infinity;
  }

  function resolveRaid(state, raid, random = Math.random) {
    if (raid.level === 'calm') return { events: ['昨夜平静'], lost: 0, fences: 0, gold: 0, items: 0, repelled: 0 };
    const events = raid.attackers.includes('bandit') ? ['强盗从北侧林地南缘来袭'] : [];
    let lost = 0, fences = 0, gold = 0, items = 0, repelled = 0;
    for (const kind of raid.attackers) {
      if (kind === 'crow') {
        if (lost >= 3) { events.push('乌鸦无功而返'); continue; }
        const target = [];
        for (let y = 0; y < HEIGHT; y++) for (let x = 0; x < WIDTH; x++) {
          const crop = state.plots[y][x].crop;
          if (crop && crop.progress >= CROPS[crop.type].days && !protectedByScarecrow(state, x, y)) target.push({ x, y, type: crop.type });
        }
        if (target.length) {
          const { x, y, type } = target[0]; state.plots[y][x].crop = null; lost++;
          events.push(`乌鸦偷走了1棵${CROPS[type].name}`);
        } else events.push('稻草人或无目标吓退了乌鸦');
        continue;
      }
      const reachable = Number.isFinite(raidDistance(state, state.farmer.x, state.farmer.y));
      if (!reachable) {
        const barriers = [];
        for (let y = 0; y < HEIGHT; y++) for (let x = 0; x < WIDTH; x++) {
          if (state.plots[y][x].structure === 'fence') {
            const distance = raidDistance(state, x, y);
            if (Number.isFinite(distance)) barriers.push({ x, y, distance });
          }
        }
        barriers.sort((a, b) => a.distance - b.distance || a.y - b.y || a.x - b.x);
        if (barriers.length) {
          const { x, y } = barriers[0]; state.plots[y][x].structure = null; fences++;
          events.push('强盗啃坏一段栅栏，本次未得手');
        } else events.push('强盗被栅栏挡退');
        continue;
      }
      const bagKeys = Object.keys(CROPS).filter(key => state.bag[key] > 0);
      if (state.snacks > 0) bagKeys.push('snack');
      const cropTargets = [];
      if (lost < 3) for (let y = 0; y < HEIGHT; y++) for (let x = 0; x < WIDTH; x++) {
        const crop = state.plots[y][x].crop;
        if (crop && Number.isFinite(raidDistance(state, x, y))) cropTargets.push({ x, y, type: crop.type });
      }
      if ((!bagKeys.length || items >= 5) && (!state.gold || gold >= 200) && !cropTargets.length) {
        events.push('强盗无功而返'); continue;
      }
      if (random() < WEAPONS[state.weapon].counter) {
        state.stats.repelled++;
        repelled++;
        events.push(`农夫用${WEAPONS[state.weapon].name}反击成功，打退强盗`);
        continue;
      }
      events.push('农夫反击未成');
      if (bagKeys.length && items < 5) {
        const key = bagKeys[Math.floor(random() * bagKeys.length)];
        const available = key === 'snack' ? state.snacks : state.bag[key];
        const count = Math.min(available, 5 - items, 1 + Math.floor(random() * 3));
        if (key === 'snack') state.snacks -= count;
        else state.bag[key] -= count;
        items += count;
        events.push(`强盗抢走 ${count} 份${key === 'snack' ? '饭团' : CROPS[key].name}`);
      } else if (state.gold > 0 && gold < 200) {
        const count = Math.min(state.gold, 200 - gold, 80, Math.max(1, Math.floor(state.gold * (0.05 + random() * 0.10))));
        state.gold -= count; gold += count;
        events.push(`强盗抢走 ${count} G`);
      } else if (cropTargets.length) {
        const { x, y, type } = cropTargets[0];
        state.plots[y][x].crop = null; state.plots[y][x].tilled = false; lost++;
        events.push(`强盗毁掉1格${CROPS[type].name}`);
      }
      if (random() < 0.5) {
        const damage = 8 + Math.floor(random() * 8);
        state.health = Math.max(0, state.health - damage);
        events.push(`农夫受伤 ${damage} HP`);
      }
      if (state.health <= 0) break;
    }
    return { events, lost, fences, gold, items, repelled };
  }

  function sleep(state, random, guarded = false) {
    if (state.gameOver) return result(false, '游戏已经结束');
    const events = [];
    const raid = guarded ? { events: ['守夜成功，今晚零损失'], lost: 0, fences: 0, gold: 0, items: 0, repelled: 0 } : resolveRaid(state, state.nightRaid || { level: 'calm' }, random || Math.random);
    events.push(...raid.events);
    if (!guarded && state.health > 0) state.health = Math.min(HEALTH_MAX, state.health + 10);
    if (state.health <= 0) {
      state.gameOver = true;
      return { ...result(true, '农夫倒下了，游戏结束', events), raid };
    }
    for (const row of state.plots) {
      for (const plot of row) {
        if (plot.crop && plot.crop.progress < CROPS[plot.crop.type].days) {
          plot.crop.progress = Math.min(CROPS[plot.crop.type].days, plot.crop.progress + 1 + (state.tomorrow === 'rain' ? 1 : 0));
          if (plot.crop.progress === CROPS[plot.crop.type].days) {
            events.push(`${CROPS[plot.crop.type].name}成熟了！`);
          }
        }
      }
    }
    state.day++;
    const roll = random || Math.random;
    state.weather = state.tomorrow;
    state.tomorrow = roll() < RAIN_CHANCE[season(state)] ? 'rain' : 'sunny';
    state.nightRaid = planRaid(state.day, roll);
    events.push(state.weather === 'rain' ? '雨天使作物额外生长 1 格' : '作物每天自动生长 1 格');
    if (seasonDay(state) === 1) events.push(`进入${season(state)}季`);
    state.stats.days++;
    const expired = state.orders.filter(order => state.day > order.deadline);
    if (expired.length) events.push(`${expired.length} 个订单过期失效`);
    generateOrders(state, roll);
    return { ...result(true, `${guarded ? '守夜成功' : '睡了一觉'}，来到第 ${state.day} 天`, events), raid };
  }

  root.PocketFarm = {
    WIDTH, HEIGHT, LAYOUT, terrainAt, canWalk, cameraTarget, cameraStep, screenToCell, HEALTH_MAX, RAIN_CHANCE, CROPS, TOOLS, DIRECTIONS, BUILDINGS, FOOD_HEAL, WEAPONS, VILLAGERS, planRaid, resolveRaid,
    createGame, migrateSave, season, seasonDay, frontCell, move, selectTool, selectCrop,
    act, buySeed, sellAll, sellCrop, salePreview, orderReserve, sleep, buyWeapon, buySnack, eatFood, quickEat, generateOrders, acceptOrder, deliverOrder, findPath, placeBuilding, pathBetween, startWatch, watchStrike, watchTick, giftVillager, villagerLine
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

    if (state.gold !== goldDisplay && !goldStart) { goldFrom = goldDisplay; goldStart = performance.now(); }
    document.getElementById('hint').textContent = outcome.message;
    document.getElementById('hint').classList.toggle('error', !outcome.ok);
    if (outcome.ok && changed) {
      for (const item of outcome.events.slice().reverse()) journal.unshift(item);
      journal = journal.slice(0, 8);
      if (state.tutorial < 2 && outcome.tool === ['hoe', 'seed'][state.tutorial]) {
        state.tutorial++;
        if (state.tutorial === 2) tutorialDoneUntil = performance.now() + 1600;
      }
      save();
    }
    if (!outcome.ok && /金币|生命|种子|未解锁|锁住/.test(outcome.message)) enqueueToast(outcome.message, 'alert');
    if (outcome.ok && /购买|升级|卖出|交付/.test(outcome.message)) enqueueToast(outcome.message, 'success');
    for (const item of outcome.events || []) if (item !== outcome.message && /订单|过期/.test(item)) enqueueToast(item, 'info');
    if (state.health <= 30 && previousHealth > 30 && !lowHealthNotified) {
      enqueueToast('生命危险，吃点东西回血吧', 'alert');
      lowHealthNotified = true;
    }
    if (state.health > 30) lowHealthNotified = false;
    if (state.health <= 0) state.gameOver = true;
    render();
    if (state.gameOver) showGameOver();
  }

  function showGameOver() {
    battle = null;
    input.direction = null; input.use = false; route = [];
    document.body.classList.remove('watch-mode');
    let best = state.day - 1;
    try { best = Math.max(best, Number(localStorage.getItem(BEST_KEY)) || 0); localStorage.setItem(BEST_KEY, String(best)); } catch (_) { /* 存储不可用 */ }
    document.getElementById('game-over-stats').textContent = `存活 ${state.day - 1} 天 · 击退强盗 ${state.stats.repelled} 人 · 历史最佳 ${best} 天`;
    document.getElementById('game-over').hidden = false;
    save();
  }

  function enqueueToast(message, type = 'info') { toastQueue.push({ message, type }); updateToasts(performance.now()); }

  function updateToasts(now) {
    visibleToasts = visibleToasts.filter(item => now < item.until);
    while (visibleToasts.length < 2 && toastQueue.length) visibleToasts.push({ ...toastQueue.shift(), until: now + 2200 });
    const markup = visibleToasts.map(item =>
      `<div class="toast ${item.type} ${item.until - now < 240 ? 'leaving' : ''}"><span class="toast-icon" aria-hidden="true">${item.type === 'alert' ? '!' : item.type === 'success' ? '✓' : 'i'}</span><span>${item.message}</span></div>`
    ).join('');
    if (markup !== toastMarkup) { document.getElementById('toast-stack').innerHTML = markup; toastMarkup = markup; }
  }

  function showSeasonBanner() {
    const banner = document.getElementById('season-banner');
    banner.textContent = `${F.season(state)} · 第 1 天`;
    banner.dataset.season = F.season(state);
    banner.hidden = false;
    bannerUntil = performance.now() + 1920;
  }

  function updateOverlays(now) {
    const banner = document.getElementById('season-banner');
    if (bannerUntil && now >= bannerUntil) { banner.hidden = true; bannerUntil = 0; }
    const bubble = document.getElementById('tutorial');
    const steps = ['① 选中锄头，锄一块地', '② 种下任意种子'];
    bubble.hidden = state.tutorial >= 2 && now >= tutorialDoneUntil;
    bubble.textContent = state.tutorial >= 2 ? '祝丰收！' : steps[state.tutorial];
    const use = document.getElementById('touch-use');
    use.style.setProperty('--use-progress', input.use ? `${Math.min(100, Math.max(0, (now - (input.useNext - 180)) / 180 * 100))}%` : '0%');
    use.classList.toggle('is-pressed', input.use);
    updateToasts(now);
  }

  function initAudio() {
    if (!audio) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audio = new AudioContext();
    }
    if (audio?.state === 'suspended') audio.resume();
  }

  function tone(frequency, duration, type, delay, endFrequency) {
    if (muted || !audio) return;
    const start = audio.currentTime + (delay || 0);
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.type = type || 'sine';
    oscillator.frequency.setValueAtTime(frequency, start);
    if (endFrequency) oscillator.frequency.exponentialRampToValueAtTime(endFrequency, start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.13, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.01);
  }

  function sound(kind) {
    if (kind === 'hoe') tone(160, 0.13, 'triangle', 0, 70);
    if (kind === 'seed') tone(560, 0.08, 'sine');
    if (kind === 'scythe') { tone(440, 0.09, 'sine'); tone(660, 0.13, 'sine', 0.09); }
    if (kind === 'sell') { tone(740, 0.12, 'sine'); tone(1100, 0.2, 'sine', 0.11); }
    if (kind === 'error') tone(150, 0.19, 'sawtooth', 0, 110);
    if (kind === 'rain') tone(600, 0.18, 'triangle', 0, 340);
  }

  function addParticle(x, y, vx, vy, life, color, kind) {
    if (particles.length >= 300) particles.shift();
    particles.push({ x, y, vx, vy, life, age: 0, color, kind });
  }

  function action() {
    if (state.gameOver) return;
    initAudio();
    if (battle) { const outcome = F.watchStrike(state, battle, performance.now()); handle(outcome, true); return; }
    const nearby = Object.entries(villagers).find(([, person]) => Math.abs(person.x - state.farmer.x) + Math.abs(person.y - state.farmer.y) <= 1);
    if (nearby) { openVillager(nearby[0]); return; }
    const target = F.frontCell(state);
    const tool = state.tool;
    const harvested = state.plots[target.y]?.[target.x]?.crop?.type;
    const outcome = state.tool === 'build' && buildChoice ? F.placeBuilding(state, buildChoice) : F.act(state, true);
    if (!outcome.ok && !outcome.message.includes('种子') && state.plots[target.y]?.[target.x]?.tilled && !state.plots[target.y]?.[target.x]?.crop && !state.seeds[state.selectedCrop]) enqueueToast('没有种子了，去商店购买', 'alert');
    sound(outcome.ok ? (outcome.tool || 'seed') : 'error');
    if (!outcome.ok && target.x >= 0 && target.x < F.WIDTH && target.y >= 0 && target.y < F.HEIGHT) shake = { x: target.x, y: target.y, until: performance.now() + 150 };
    if (outcome.ok) {
      swingUntil = performance.now() + 200;
      swingTool = outcome.tool || 'seed';
      const x = FIELD_X + target.x * TILE + 24;
      const y = FIELD_Y + target.y * TILE + 20;
      if (outcome.tool === 'scythe') {
        addParticle(x, y, 0, -0.055, 600, '#fff5c2', 'text');
        addParticle(x, y, 0, 0, 530, cropColors[harvested] || '#e8c373', 'harvest');
      }
    }
    handle(outcome, true);
  }

  function move(direction) {
    if (state.gameOver) return;
    initAudio();
    const outcome = F.move(state, direction);
    if (outcome.ok) walkingUntil = performance.now() + 190;
    handle(outcome, true);
  }

  function pressDirection(direction, source) {
    if (state.gameOver) return;
    if (input.direction && input.source !== source) return;
    if (input.direction === direction) return;
    route = [];
    homeRoute = false;
    document.getElementById('home-confirm').hidden = true;
    input.direction = direction;
    input.source = source;
    const now = performance.now();
    input.turned = state.farmer.facing !== direction;
    if (input.turned) {
      state.farmer.facing = direction;
      handle({ ok: true, message: '转向', events: [] }, true);
      input.next = now + 120;
    } else {
      move(direction);
      input.next = now + 140;
    }
  }

  function releaseDirection(source) {
    if (input.source === source) { input.direction = null; input.source = null; }
  }

  function pressUse() {
    if (state.gameOver) return;
    if (input.use) return;
    route = [];
    homeRoute = false;
    input.use = true;
    action();
    input.useNext = performance.now() + 180;
  }

  function tickInput(now) {
    if (state.gameOver) return;
    if (input.direction && now >= input.next) {
      move(input.direction);
      input.next = now + 140;
    }
    if (input.use && now >= input.useNext) {
      action();
      input.useNext = now + 180;
    }
  }

  function hash(x, y, n) {
    let value = Math.sin(x * 127.1 + y * 311.7 + n * 73.9) * 43758.5453;
    return value - Math.floor(value);
  }

  function box(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function label(text, x, y, color, size) {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px monospace`;
    ctx.fillText(text, Math.round(x), Math.round(y));
  }

  function shadow(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(Math.round(x + 3), Math.round(y + 3), rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#293c3655';
    ctx.fill();
  }

  function pixelLine(x1, y1, x2, y2, color, size = 1) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = size / RENDER_SCALE;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawBackground() {
    const p = palette[F.season(state)];
    const L = F.LAYOUT;
    box(0, 0, F.WIDTH * TILE, F.HEIGHT * TILE, p.grass);
    for (let y = 0; y < F.HEIGHT; y++) for (let x = 0; x < F.WIDTH; x++) {
      const px = FIELD_X + x * TILE, py = FIELD_Y + y * TILE;
      const terrain = F.terrainAt(x, y);
      if (terrain === 'pond') {
        box(px, py, TILE, TILE, '#6aaeb7');
        box(px + 3, py + 4, TILE - 6, 2, '#a8d6c9');
      } else if (terrain === 'path' || x === L.gate.x && y >= L.farm.bottom - 1) {
        box(px, py, TILE, TILE, '#b9a276');
        box(px + 4, py + 8, TILE - 8, 2, '#d3c09a');
      } else {
        box(px, py, TILE, TILE, terrain === 'residential' ? p.light : p.grass);
        for (let i = 0; i < 5; i++) {
          const gx = px + 4 + Math.floor(hash(x, y, 20 + i) * 39);
          const gy = py + 5 + Math.floor(hash(x, y, 30 + i) * 38);
          box(gx, gy, 2, 3, p.grassDark);
        }
      }
      if (terrain === 'tree') drawTreeTrunk(px + 4, py - 8);
      const shore = (x === L.pond.left - 1 || x === L.pond.right + 1) && y >= L.pond.top && y <= L.pond.bottom ||
        (y === L.pond.top - 1 || y === L.pond.bottom + 1) && x >= L.pond.left && x <= L.pond.right;
      if (shore) {
        box(px + 30, py + 14, 2, 27, '#789756');
        box(px + 28, py + 13, 6, 8, '#af9d69');
      }
    }
    // 村口道路向画面南侧继续，村牌仅作装饰。
    box(L.gate.x * TILE + 5, L.gate.y * TILE, TILE - 10, TILE, '#b9a276');
    box(L.gate.x * TILE + TILE - 7, L.gate.y * TILE - 27, 4, 35, '#806447');
    box(L.gate.x * TILE + TILE - 25, L.gate.y * TILE - 30, 28, 16, '#d9ba7f');
    label('村口', L.gate.x * TILE + TILE - 23, L.gate.y * TILE - 18, '#654d39', 10);
  }

  function drawAmbient(now) {
    const p = palette[F.season(state)];
    for (let y = 0; y < F.HEIGHT; y++) for (let x = 0; x < F.WIDTH; x++) {
      const px = FIELD_X + x * TILE + 7 + Math.floor(hash(x, y, 40) * 34);
      const py = FIELD_Y + y * TILE + 12 + Math.floor(hash(x, y, 50) * 30);
      const sway = Math.sin(now / 680 + x * 1.7 + y * 2.3) * 1.5;
      pixelLine(px, py + 4, px - 2 + sway, py, p.grassDark, 0.5);
    }
    const cloudX = ((now % 8000) / 8000) * (WORLD_WIDTH + 200) - 150;
    ctx.fillStyle = '#3d5b5540';
    ctx.beginPath(); ctx.ellipse(cloudX, 285, 105, 27, -0.15, 0, Math.PI * 2); ctx.fill();
  }

  function drawTreeTrunk(x, y) {
    shadow(x + 21, y + 55, 22, 6);
    box(x + 15, y + 20, 9, 38, '#795d45');
    box(x + 17, y + 28, 2, 20, '#9d7650'); box(x + 22, y + 38, 2, 15, '#634735');
    box(x + 8, y + 26, 24, 4, '#795d45');
  }

  function drawTreeCanopy(x, y, now) {
    const season = F.season(state);
    const sway = Math.round(Math.sin(now / 840 + x * 0.21) * 1);
    if (season === '冬') {
      box(x + 3 + sway, y + 24, 15, 3, '#eef5ec');
      box(x + 23 + sway, y + 20, 15, 3, '#eef5ec');
    } else {
      const color = { '春': '#e7a5b1', '夏': '#5e9d58', '秋': '#dfbd62' }[season];
      const dark = { '春': '#b98099', '夏': '#397749', '秋': '#aa8748' }[season];
      box(x + 4 + sway, y + 8, 32, 28, dark);
      box(x + 11 + sway, y, 19, 40, dark);
      box(x + 8 + sway, y + 5, 19, 12, color);
      box(x + 17 + sway, y + 18, 19, 12, color);
      box(x + 4 + sway, y + 22, 14, 10, color);
    }
  }

  function drawPondRipples(now) {
    const L = F.LAYOUT.pond;
    for (let i = 0; i < 3; i++) {
      const px = (L.left + 0.8 + i) * TILE;
      const py = (L.top + 1 + i % 2) * TILE;
      const age = (now + i * 400) % 1200 / 1200;
      ctx.globalAlpha = 1 - age;
      ctx.beginPath(); ctx.ellipse(px, py, 3 + age * 16, 2 + age * 7, 0, 0, Math.PI * 2);
      ctx.strokeStyle = '#e7f4e4'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHouseCell(cell, name) {
    const x = cell.x * TILE, y = cell.y * TILE;
    shadow(x + 24, y + 43, 23, 5);
    box(x + 4, y + 15, 40, 29, '#dfbf86');
    box(x + 1, y + 10, 46, 10, '#825942');
    box(x + 7, y + 5, 34, 8, '#a26d4c');
    box(x + 17, y + 27, 14, 17, '#785b45');
    box(x + 7, y + 25, 7, 7, '#ffe0a1');
    label(name, x + 5, y + 3, '#634c38', 10);
  }

  function drawHouses() {
    drawHouseCell(F.LAYOUT.home, '家');
    F.LAYOUT.huts.forEach((hut, i) => drawHouseCell(hut, ['村长', '婆婆', '猎手'][i]));
    const x = F.LAYOUT.square.x * TILE, y = F.LAYOUT.square.y * TILE;
    box(x + 12, y + 13, 24, 20, '#c9af80');
    box(x + 18, y + 18, 12, 8, '#e9d5a9');
  }

  function drawPlot(plot, x, y) {
    if (!plot.tilled && !plot.structure) return;
    const px = FIELD_X + x * TILE, py = FIELD_Y + y * TILE;
    if (plot.structure) {
      if (plot.structure === 'fence') { box(px + 5, py + 16, 38, 8, '#8a6040'); box(px + 9, py + 7, 6, 34, '#c99b70'); box(px + 32, py + 7, 6, 34, '#c99b70'); }
      else { box(px + 22, py + 8, 4, 35, '#76533f'); box(px + 7, py + 15, 34, 5, '#a17855'); box(px + 14, py + 5, 20, 8, '#d1aa7c'); box(px + 18, py + 21, 12, 12, '#e8c373'); }
      return;
    }
    box(px + 2, py + 4, 44, 41, '#8a6249');
    box(px + 4, py + 5, 39, 3, '#a17855');
    box(px + 7, py + 14, 34, 2, '#76533f');
    box(px + 5, py + 29, 36, 2, '#76533f');
    box(px + 8, py + 16, 30, 1, '#bb8e65');
    box(px + 6, py + 31, 34, 1, '#bb8e65');
    for (let i = 0; i < 4; i++) {
      const dx = 8 + Math.floor(hash(x, y, 70 + i) * 31), dy = 9 + Math.floor(hash(x, y, 80 + i) * 30);
      box(px + dx, py + dy, 4, 2, '#af805c');
    }
    if (F.season(state) === '冬') {
      box(px + 2, py + 3, 43, 2, '#f3f5e9');
      box(px + 2, py + 3, 2, 41, '#e8f0e9');
    }
    pixelLine(px + 4.5, py + 7.5, px + 42.5, py + 7.5, '#d1aa7c');
    pixelLine(px + 8, py + 16.5, px + 38, py + 16.5, '#d2ad795c');
    if (plot.crop) {
      shadow(px + 24, py + 38, 13, 4);
      drawCrop(ctx, plot.crop, px, py, performance.now());
    }
  }

  function drawCrop(target, crop, px, py, now) {
    const progress = crop.progress;
    const mature = progress >= F.CROPS[crop.type].days;
    const offset = mature && Math.floor(now / 800) % 2 ? -1 : 0;
    py += offset;
    const center = px + 24;
    const paint = (x, y, w, h, color) => { target.fillStyle = color; target.fillRect(Math.round(x), Math.round(y), w, h); };
    const line = (x1, y1, x2, y2, color) => {
      target.beginPath(); target.moveTo(x1, y1); target.lineTo(x2, y2);
      target.strokeStyle = color; target.lineWidth = 0.5; target.lineCap = 'round'; target.stroke();
    };
    if (progress === 0) {
      paint(center - 6, py + 27, 12, 6, '#a77b53');
      if (crop.type === 'carrot') paint(center - 2, py + 24, 4, 5, '#e7bd7b');
      if (crop.type === 'potato') paint(center - 4, py + 23, 8, 6, '#c8aa7c');
      if (crop.type === 'pumpkin') { paint(center - 3, py + 24, 6, 4, '#e0c184'); paint(center - 1, py + 21, 2, 4, '#74a153'); }
      if (crop.type === 'strawberry') { paint(center - 2, py + 24, 4, 4, '#ae6156'); paint(center + 2, py + 25, 2, 3, '#ebd7a0'); }
      if (crop.type === 'corn') { paint(center - 4, py + 24, 4, 6, '#f6d46b'); paint(center + 2, py + 26, 3, 4, '#f6d46b'); }
      paint(center - 4, py + 27, 2, 1, '#f3d3a0');
      line(center - 4, py + 30.5, center + 4, py + 30.5, '#f5dba7');
      return;
    }
    if (progress === 1) {
      paint(center - 2, py + 23, 4, 15, '#5b914c');
      if (crop.type === 'carrot') { paint(center - 8, py + 19, 7, 5, '#77b758'); paint(center + 2, py + 17, 7, 5, '#69a753'); }
      if (crop.type === 'potato') { paint(center - 12, py + 23, 11, 7, '#77b758'); paint(center + 2, py + 21, 11, 7, '#69a753'); }
      if (crop.type === 'pumpkin') { paint(center - 11, py + 25, 10, 5, '#77b758'); paint(center + 2, py + 25, 10, 5, '#69a753'); paint(center - 1, py + 19, 3, 6, '#8eb75c'); }
      if (crop.type === 'strawberry') { paint(center - 11, py + 24, 10, 5, '#77b758'); paint(center + 2, py + 22, 10, 5, '#69a753'); }
      if (crop.type === 'corn') { paint(center - 8, py + 20, 7, 4, '#77b758'); paint(center + 2, py + 17, 7, 4, '#69a753'); }
      if (crop.type === 'carrot') { line(center - 7, py + 20, center - 2, py + 21, '#b5db78'); line(center + 3, py + 19, center + 8, py + 18, '#b5db78'); }
      if (crop.type === 'potato') { line(center - 8, py + 28, center + 7, py + 24, '#3c7440'); paint(center + 5, py + 22, 2, 2, '#a6cb72'); }
      if (crop.type === 'pumpkin') line(center - 10, py + 28, center + 11, py + 27, '#426e38');
      if (crop.type === 'strawberry') { paint(center - 7, py + 22, 3, 2, '#a0cb69'); paint(center + 5, py + 20, 3, 2, '#a0cb69'); }
      if (crop.type === 'corn') { paint(center - 1, py + 21, 2, 8, '#a1c66a'); line(center + 4, py + 19, center + 8, py + 17, '#b6d57a'); }
      line(center - 7, py + 23.5, center - 2, py + 25, '#dbec9b');
      line(center + 3, py + 22, center + 8, py + 20.5, '#dbec9b');
      return;
    }
    if (crop.type === 'carrot') {
      paint(center - 2, py + 13, 4, 25, '#4c853e');
      paint(center - 12, py + 17, 11, 6, '#66a94c');
      paint(center + 1, py + 14, 12, 7, '#80b951');
      paint(center - 8, py + 9, 6, 11, '#78b353');
      line(center - 8, py + 19, center - 1, py + 21, '#b4d971');
      line(center + 2, py + 17, center + 10, py + 16, '#b4d971');
      line(center - 5, py + 12, center - 4, py + 18, '#b4d971');
      if (mature) {
        paint(center - 9, py + 26, 18, 10, '#dc6b3d');
        paint(center - 7, py + 36, 14, 4, '#ed8150');
        paint(center - 4, py + 40, 8, 3, '#f1ddd0');
        paint(center - 2, py + 43, 4, 2, '#fff2db');
        paint(center - 7, py + 28, 5, 2, '#f3a06a');
      }
    } else if (crop.type === 'potato') {
      paint(center - 15, py + 24, 30, 12, '#4d8b47');
      paint(center - 11, py + 17, 13, 12, '#6fab55');
      paint(center + 1, py + 14, 14, 15, '#79b45f');
      paint(center - 4, py + 10, 8, 9, '#5c9d4c');
      line(center - 13, py + 32, center - 4, py + 24, '#3d7140');
      line(center - 4, py + 24, center + 8, py + 29, '#3d7140');
      if (mature) {
        paint(center - 16, py + 32, 13, 9, '#c9a376');
        paint(center + 3, py + 31, 14, 10, '#d8b684');
        paint(center - 11, py + 35, 2, 2, '#9a7758');
        paint(center + 9, py + 34, 2, 2, '#9a7758');
        paint(center - 6, py + 15, 4, 3, '#f7f2de'); paint(center + 7, py + 18, 4, 3, '#fff9e8');
        line(center - 12, py + 38, center - 8, py + 35, '#8c6b4f');
        line(center + 2, py + 39, center + 6, py + 37, '#8c6b4f');
      }
    } else if (crop.type === 'pumpkin') {
      paint(center - 18, py + 30, 36, 5, '#4f8541');
      paint(center - 17, py + 23, 12, 11, '#6da449');
      paint(center + 6, py + 20, 12, 12, '#76ad4d');
      paint(center - 2, py + 15, 4, 17, '#5c8739');
      line(center - 17, py + 34, center + 13, py + 31, '#426f36');
