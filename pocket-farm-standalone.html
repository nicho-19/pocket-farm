<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口袋田园</title>
  <style>
:root{--cream:#f8f1df;--paper:#fffaf0;--ink:#334139;--muted:#7d8777;--line:#d8d6b9;--green:#537b4c;--green-dark:#315a40;--gold:#aa7436;--shadow:#d6cbaa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0%,#ecf1d4,transparent 30%),linear-gradient(135deg,#e9e7cf,#dbe6d3);color:var(--ink);font-family:Verdana,"Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
.page{max-width:1390px;margin:auto;padding:25px 28px 16px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.header-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.eyebrow{color:#73906c;font-size:11px;font-weight:bold;letter-spacing:.2em}
h1{font-family:Georgia,"Microsoft YaHei",serif;font-size:40px;line-height:1;margin:9px 0 0;color:#31553d;letter-spacing:.07em;text-shadow:2px 2px 0 #fdfbf1}
h1 span{color:#d79a67;font-size:27px;vertical-align:top}
h2{font-size:16px;margin:0;color:#3a5540}
.quiet-button{background:#f8f4e5;border:1px solid #c9ccb3;color:#65765e;border-radius:8px;padding:10px 15px;box-shadow:0 2px 0 #c7c6aa}
.quiet-button:hover,.shop-list button:hover{background:#e8eed8}
.status-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.6fr;gap:0;background:var(--paper);border:2px solid #d9d5b7;border-bottom-width:4px;border-radius:13px;padding:12px 5px;margin-bottom:17px;box-shadow:0 7px 22px #65785d18}
.status-item{padding:3px 22px;border-right:1px solid #e5e1ca;display:flex;flex-direction:column;gap:5px;min-height:42px}.status-item:last-child{border:0}
.status-item span{color:var(--muted);font-size:11px;letter-spacing:.08em}.status-item strong{font-size:17px;color:#3c5d43}.energy-item span{display:flex;justify-content:space-between}.energy-item b{font-weight:normal;letter-spacing:0}
.energy-track{height:13px;border:2px solid #8a9b75;background:#e4e8d5;border-radius:5px;overflow:hidden;margin-top:5px}.energy-track div{height:100%;width:100%;background:linear-gradient(90deg,#85b56c,#bdd67d);transition:width .2s}
.main-grid{display:grid;grid-template-columns:minmax(0,768px) minmax(275px,1fr);gap:20px;align-items:start}
.scene-frame{padding:7px;background:#fdf9e8;border:2px solid #b6ba91;border-bottom-width:5px;border-radius:12px;box-shadow:0 10px 25px #41554124;line-height:0;touch-action:none}.scene-frame canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:4px;touch-action:none}
.tool-panel,.side-card{background:var(--paper);border:1px solid #d9d7bb;border-bottom:3px solid #cbc9aa;border-radius:11px;padding:16px;margin-top:16px;box-shadow:0 5px 17px #59705111}
.panel-heading{display:flex;justify-content:space-between;align-items:baseline;gap:9px;margin-bottom:13px}.panel-heading span{color:#9b9d84;font-size:11px;white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tool{border:2px solid #d8d8bf;border-radius:8px;background:#f8f5e7;padding:9px 5px;color:#566452;display:flex;align-items:center;justify-content:center;gap:6px;min-height:56px}.tool.active{background:#e8efcf;border-color:#678b56;box-shadow:inset 0 0 0 1px #fff,0 3px 0 #a6be88;color:#31583b;font-weight:bold}.tool-icon{font-size:20px}.tool small{font-size:10px;color:#8a9578}
.crop-options{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}.crop-options>span{font-size:12px;color:#76866d;margin-right:3px}.crop-choice{border:1px solid #d8d7bd;background:#fffdf2;border-radius:30px;color:#61725c;padding:9px 12px;min-height:44px;font-size:12px}.crop-choice.active{border-color:#d09b5e;background:#fff0d8;color:#8b5a32;font-weight:bold}
.hint{min-height:42px;background:#eff3dc;border:1px dashed #afbd8c;border-radius:8px;padding:11px 14px;font-size:13px;color:#506548;margin:12px 0 0}.hint.error{background:#fff0e3;color:#a66339;border-color:#d5a27a}
.sidebar .side-card:first-child{margin-top:0}.intro-card{background:#eaf0dc;border-color:#c1d0a6}.intro-card h2{font-family:Georgia,"Microsoft YaHei",serif;font-size:22px;margin:10px 0}.intro-card p{font-size:13px;line-height:1.8;color:#62725e;margin:0 0 13px}.key-help{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 11px;font-size:12px;color:#687d60;margin-bottom:17px}kbd{font-family:inherit;background:#fbfbeb;border:1px solid #c5d2ac;border-bottom-width:3px;padding:4px 8px;border-radius:5px;text-align:center;color:#4c6648;font-size:11px}
.primary-button,.sell-button{width:100%;background:#527d4d;color:#fff9e7;border:0;border-bottom:4px solid #355b37;border-radius:8px;padding:12px 10px;font-weight:bold}.primary-button:hover,.sell-button:hover{background:#628e58}.primary-button:active,.sell-button:active{transform:translateY(2px);border-bottom-width:2px}
.bag-list,.shop-list{display:flex;flex-direction:column}.bag-row,.shop-row{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed #e4dfc8;padding:8px 2px;font-size:13px}.bag-row:first-child,.shop-row:first-child{border-top:0}.bag-row span:first-child,.shop-row span:first-child{display:flex;align-items:center;gap:8px}.crop-dot{display:inline-block;width:14px;height:14px;border:2px solid #ffffff;border-radius:4px;box-shadow:0 0 0 1px #adac8a}.bag-row strong{color:#496b47}.shop-row small{color:#9b896d}.shop-row button{background:#f5f2df;border:1px solid #cbd3af;border-radius:6px;color:#547451;padding:9px;min-height:44px;font-size:12px}.sell-button{margin-top:10px;background:#ad8049;border-bottom-color:#795b35}.sell-button:hover{background:#bd915a}
.touch-controls{display:none;justify-content:space-between;align-items:end;padding:12px 4px 0;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:3px}.dpad button,.touch-use{border:2px solid #a3b591;border-bottom-width:4px;background:#e7efd9;color:#345840;border-radius:12px;font-size:20px;font-weight:bold;touch-action:none}.dpad [data-direction=up]{grid-column:2}.dpad [data-direction=left]{grid-column:1;grid-row:2}.dpad [data-direction=down]{grid-column:2;grid-row:2}.dpad [data-direction=right]{grid-column:3;grid-row:2}.touch-use{width:90px;height:90px;background:#dbad72;color:#603e25;border-color:#a7794e}
.modal{position:fixed;inset:0;z-index:10;background:#263a32ab;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.modal-card{width:min(590px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:3px solid #c9c79f;border-radius:14px;padding:20px;box-shadow:0 18px 50px #15251a66}.modal-card p{font-size:12px;color:var(--muted)}.codex-row{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:12px;border-top:1px dashed var(--line);padding:9px 0;font-size:12px}.codex-row canvas{width:48px;height:48px;image-rendering:pixelated}.codex-row strong{display:block;font-size:14px;margin-bottom:4px}
.log-card ul{padding:0;margin:0;list-style:none;max-height:150px;overflow:auto}.log-card li{font-size:12px;line-height:1.55;padding:6px 2px;border-top:1px dashed #e5e0c9;color:#667560}.log-card li:first-child{border-top:0}.log-card li:before{content:'✦';color:#ca9b63;margin-right:8px}footer{text-align:center;color:#8b987e;font-size:11px;padding:21px 0 2px}
@media(max-width:1000px){.main-grid{grid-template-columns:minmax(0,1fr) 280px}.page{padding:18px}.tool{flex-direction:column;gap:1px}}
@media(max-width:760px){.main-grid{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sidebar .side-card{margin:0}.status-item{padding:3px 10px}.status-item strong{font-size:14px}.touch-controls{display:flex}}
@media(max-width:520px){.page{padding:12px}.masthead{margin-bottom:13px}h1{font-size:30px}.header-actions .quiet-button{padding:8px;font-size:12px}.status-bar{grid-template-columns:repeat(2,1fr);row-gap:10px}.status-item:nth-child(2),.status-item:nth-child(4){border-right:0}.energy-item{grid-column:span 2}.sidebar{display:block}.sidebar .side-card{margin-top:12px}.tool{font-size:11px}.panel-heading span{font-size:10px}}
.status-bar,.tool-panel,.side-card,.modal-card{background:linear-gradient(145deg,#fffaf0 0%,#f7efd9 100%);border-color:#a5784f;box-shadow:inset 0 0 0 2px #ecd3a6,0 5px 17px #593b2b20}
.status-item strong,.energy-item b{font-weight:800}
.tool.active{outline:2px solid #d8a95b;box-shadow:0 0 12px #e6ba65,inset 0 0 0 1px #fff}
.log-card li:first-child{animation:log-fade .45s ease-out}@keyframes log-fade{from{opacity:0}to{opacity:1}}
.dpad button,.touch-use{min-width:56px;min-height:56px;background:#e7efd9ce;transition:transform .08s;backdrop-filter:blur(2px)}
.dpad{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px)}
.dpad button:active,.touch-use:active{transform:scale(.92)}
.modal-open .touch-controls{visibility:hidden}
.order-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px dashed #d6c099;padding:12px 0;font-size:13px;line-height:1.7}
.order-row button,.bag-row button,.tabs button{border:1px solid #af885b;background:#f5e8c7;border-radius:6px;padding:8px 12px;color:#5c4c32}
.tabs{display:flex;gap:8px;margin:12px 0}
.modal:not([hidden]) .modal-card{animation:panel-enter .15s ease-out both}
@keyframes panel-enter{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.tool.bump .tool-icon{display:inline-block;animation:tool-bump .28s ease-out}
@keyframes tool-bump{0%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.14)}75%{transform:translateY(2px)}100%{transform:translateY(0)}}
.energy-track div{transition:width .2s ease-out}

</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div><span class="eyebrow">一方小田 · 四季慢生活</span><h1>口袋田园 <span>✿</span></h1></div>
      <div class="header-actions"><button id="mute" class="quiet-button" type="button" aria-pressed="false">🔊 音效</button><button id="orders-button" class="quiet-button" type="button">订单</button><button id="codex" class="quiet-button" type="button">图鉴</button><button id="new-game" class="quiet-button" type="button">新游戏</button></div>
    </header>
    <section class="status-bar" aria-label="农场状态">
      <div class="status-item"><span>日期</span><strong id="date"></strong></div>
      <div class="status-item"><span>天气</span><strong id="weather"></strong></div>
      <div class="status-item"><span>预报</span><strong id="tomorrow"></strong></div>
      <div class="status-item"><span>金币</span><strong id="gold"></strong></div>
      <div class="status-item energy-item"><span>体力 <b id="energy-text"></b></span><div class="energy-track"><div id="energy-fill"></div></div></div>
    </section>
    <main class="main-grid">
      <section class="play-area" aria-label="农场">
        <div class="scene-frame"><canvas id="farm" width="768" height="576" aria-label="口袋田园农场画面"></canvas></div>
        <div class="touch-controls" aria-label="手机操作"><div class="dpad"><button type="button" data-direction="up" aria-label="上移">▲</button><button type="button" data-direction="left" aria-label="左移">◀</button><button type="button" data-direction="down" aria-label="下移">▼</button><button type="button" data-direction="right" aria-label="右移">▶</button></div><button id="touch-use" class="touch-use" type="button">使用</button></div>
        <div class="tool-panel">
          <div class="panel-heading"><h2>农具与种子</h2><span>按 1–4 切换工具</span></div>
          <div id="tools" class="tools"></div>
          <div id="crop-options" class="crop-options"></div>
        </div>
        <p id="hint" class="hint" role="status"></p>
      </section>
      <aside class="sidebar">
        <section class="side-card intro-card">
          <span class="eyebrow">今天的农事</span>
          <h2>把小日子种出来。</h2>
          <p>移动到地块旁，面向它，依次开垦、播种、浇水。睡一觉，等待收成。</p>
          <div class="key-help"><kbd>W A S D</kbd><span>移动 / 转向</span><kbd>空格</kbd><span>对前方操作</span></div>
          <button id="sleep" class="primary-button" type="button">☾ &nbsp; 睡觉 · 进入下一天</button>
        </section>
        <section class="side-card">
          <div class="panel-heading"><h2>背包</h2><span>收获后存放在这里</span></div>
          <div id="bag" class="bag-list"></div>
        </section>
        <section class="side-card shop-card">
          <div class="panel-heading"><h2>村口商店</h2><span>买种子，卖收成</span></div>
          <div id="shop" class="shop-list"></div>
          <button id="sell-all" class="sell-button" type="button">出货箱 · 全部卖出</button>
        </section>
        <section class="side-card log-card">
          <div class="panel-heading"><h2>田园日记</h2><span>最近发生的事</span></div>
          <ul id="log" aria-live="polite"></ul>
        </section>
      </aside>
    </main>
    <footer>一格一格耕耘，过好每一天。 · 致敬《星露谷物语》</footer>
  </div>
  <div id="codex-panel" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="作物图鉴"><div class="panel-heading"><h2>图鉴与统计</h2><button id="close-codex" class="quiet-button" type="button">关闭</button></div><div class="tabs"><button id="crop-tab" type="button">作物</button><button id="stats-tab" type="button">统计</button></div><div id="codex-list"></div><div id="stats-list" hidden></div></div></div>
  <div id="orders-panel" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-label="订单板"><div class="panel-heading"><h2>今日订单</h2><button id="close-orders" class="quiet-button" type="button">关闭</button></div><div id="orders-list"></div></div></div>
  <script>
(function (root) {
  'use strict';

  const WIDTH = 12;
  const HEIGHT = 9;
  const ENERGY_MAX = 40;
  const RAIN_CHANCE = { '春': 0.30, '夏': 0.40, '秋': 0.25, '冬': 0.20 };
  const SEASONS = ['春', '夏', '秋', '冬'];
  const CROPS = {
    carrot: { name: '萝卜', days: 3, seedPrice: 10, sellPrice: 25 },
    potato: { name: '土豆', days: 4, seedPrice: 18, sellPrice: 48 },
    pumpkin: { name: '南瓜', days: 5, seedPrice: 30, sellPrice: 85 },
    strawberry: { name: '草莓', days: 4, seedPrice: 30, sellPrice: 81 },
    corn: { name: '玉米', days: 3, seedPrice: 15, sellPrice: 38 }
  };
  const TOOLS = {
    hoe: { name: '锄头', cost: 4 },
    seed: { name: '种子', cost: 2 },
    water: { name: '水壶', cost: 2 },
    scythe: { name: '镰刀', cost: 3 }
  };
  const DIRECTIONS = {
    up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]
  };

  function makePlot() {
    return { tilled: false, watered: false, crop: null };
  }

  function cropCounts() {
    return Object.fromEntries(Object.keys(CROPS).map(key => [key, 0]));
  }

  function createGame() {
    return {
      version: 3,
      day: 1,
      weather: 'sunny',
      tomorrow: 'sunny',
      gold: 100,
      energy: ENERGY_MAX,
      farmer: { x: 5, y: 4, facing: 'down' },
      tool: 'hoe',
      selectedCrop: 'carrot',
      seeds: { ...cropCounts(), carrot: 3 },
      bag: cropCounts(),
      snacks: 0,
      upgrades: { hoe: false, water: false },
      orders: [],
      nextOrderId: 1,
      stats: { income: 0, harvested: 0, orders: 0, days: 0 },
      manualTool: false,
      plots: Array.from({ length: HEIGHT }, () => Array.from({ length: WIDTH }, makePlot))
    };
  }

  function migrateSave(saved) {
    if (!saved || ![1, 2, 3].includes(saved.version) ||
        !Array.isArray(saved.plots) || saved.plots.length !== HEIGHT ||
        !saved.plots.every(row => Array.isArray(row) && row.length === WIDTH) ||
        !saved.farmer || !inBounds(saved.farmer.x, saved.farmer.y) ||
        !DIRECTIONS[saved.farmer.facing] || !TOOLS[saved.tool] ||
        !CROPS[saved.selectedCrop] || !Number.isFinite(saved.day) ||
        !Number.isFinite(saved.gold) || !Number.isFinite(saved.energy)) return null;
    saved.seeds = { ...cropCounts(), ...saved.seeds };
    saved.bag = { ...cropCounts(), ...saved.bag };
    for (const row of saved.plots) {
      for (const plot of row) {
        if (!plot || typeof plot !== 'object' ||
            (plot.crop && !CROPS[plot.crop.type])) return null;
      }
    }
    saved.tomorrow = saved.tomorrow === 'rain' ? 'rain' : 'sunny';
    saved.snacks = Number.isInteger(saved.snacks) && saved.snacks >= 0 ? saved.snacks : 0;
    saved.upgrades = { hoe: !!saved.upgrades?.hoe, water: !!saved.upgrades?.water };
    saved.orders = Array.isArray(saved.orders) ? saved.orders.filter(order => CROPS[order.crop] && Number.isInteger(order.amount) && order.amount > 0 && Number.isInteger(order.deadline) && Number.isInteger(order.reward)) : [];
    saved.nextOrderId = Number.isInteger(saved.nextOrderId) ? saved.nextOrderId : 1;
    saved.stats = { income: 0, harvested: 0, orders: 0, days: 0, ...saved.stats };
    saved.manualTool = !!saved.manualTool;
    saved.version = 3;
    return saved;
  }

  function season(state) {
    return SEASONS[Math.floor((state.day - 1) / 28) % SEASONS.length];
  }

  function seasonDay(state) {
    return ((state.day - 1) % 28) + 1;
  }

  function frontCell(state) {
    const offset = DIRECTIONS[state.farmer.facing];
    return { x: state.farmer.x + offset[0], y: state.farmer.y + offset[1] };
  }

  function inBounds(x, y) {
    return x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;
  }

  function result(ok, message, events) {
    return { ok, message, events: events || (ok ? [message] : []) };
  }

  function move(state, direction) {
    if (!DIRECTIONS[direction]) return result(false, '无效方向');
    state.farmer.facing = direction;
    const [dx, dy] = DIRECTIONS[direction];
    const x = state.farmer.x + dx;
    const y = state.farmer.y + dy;
    if (!inBounds(x, y)) return result(false, '农场边界，不能再往前走了');
    if (state.plots[y][x].crop) return result(false, '作物挡住了去路');
    state.farmer.x = x;
    state.farmer.y = y;
    return result(true, '移动', []);
  }

  function selectTool(state, tool) {
    if (!TOOLS[tool]) return result(false, '无效工具');
    state.tool = tool;
    state.manualTool = true;
    return result(true, `已选择${TOOLS[tool].name}`, []);
  }

  function selectCrop(state, crop) {
    if (!CROPS[crop]) return result(false, '无效作物');
    state.selectedCrop = crop;
    return result(true, `已选择${CROPS[crop].name}种子`, []);
  }

  function act(state, smart) {
    const { x, y } = frontCell(state);
    if (!inBounds(x, y)) return result(false, '前方没有地块');
    const plot = state.plots[y][x];
    let tool = state.tool;
    if (smart && !state.manualTool) {
      if (plot.crop && plot.crop.progress >= CROPS[plot.crop.type].days) tool = 'scythe';
      else if (plot.crop && !plot.watered) tool = 'water';
      else if (plot.tilled && !plot.crop && state.seeds[state.selectedCrop] > 0) tool = 'seed';
      else if (!plot.tilled) tool = 'hoe';
    }
    const crop = state.selectedCrop;
    const cost = tool === 'hoe' && state.upgrades.hoe ? 2 : TOOLS[tool].cost;
    if (state.energy < cost) return result(false, '体力不足，回家睡一觉吧');

    let message;
    if (tool === 'hoe') {
      if (plot.tilled) return result(false, '这块地已经开垦过了');
      plot.tilled = true;
      message = '开垦了一块田地';
    } else if (tool === 'seed') {
      if (!plot.tilled) return result(false, '先用锄头开垦土地');
      if (plot.crop) return result(false, '这块地已经有作物了');
      if (state.seeds[crop] < 1) return result(false, `${CROPS[crop].name}种子不够，去商店购买`);
      state.seeds[crop]--;
      plot.crop = { type: crop, progress: 0 };
      plot.watered = state.weather === 'rain';
      message = `播下${CROPS[crop].name}种子`;
    } else if (tool === 'water') {
      if (!plot.crop) return result(false, '这里没有需要浇水的作物');
      if (plot.watered) return result(false, '这块地今天已经浇过水了');
      const cells = state.upgrades.water ? [-1, 0, 1] : [0];
      for (const offset of cells) {
        const side = ['up', 'down'].includes(state.farmer.facing) ? state.plots[y]?.[x + offset] : state.plots[y + offset]?.[x];
        if (side?.crop) side.watered = true;
      }
      message = `给${CROPS[plot.crop.type].name}浇了水`;
    } else if (tool === 'scythe') {
      if (!plot.crop) return result(false, '这里没有作物');
      const planted = plot.crop;
      if (planted.progress < CROPS[planted.type].days) return result(false, '作物还没有成熟');
      state.bag[planted.type]++;
      state.stats.harvested++;
      plot.crop = null;
      plot.watered = false;
      message = `收获了${CROPS[planted.type].name}，已放入背包`;
    }
    state.energy -= cost;

      return { id: state.nextOrderId++, crop, amount, deadline: state.day + 2 + Math.floor(roll() * 3), reward: Math.round(CROPS[crop].sellPrice * amount * 1.5) + 5 + Math.floor(roll() * 11) };

  function drawCrop(target, crop, px, py, now) {
    const progress = crop.progress;
    const mature = progress >= F.CROPS[crop.type].days;
    const offset = mature && Math.floor(now / 800) % 2 ? -1 : 0;
    py += offset;
    const center = px + 24;
    const paint = (x, y, w, h, color) => { target.fillStyle = color; target.fillRect(Math.round(x), Math.round(y), w, h); };
    const line = (x1, y1, x2, y2, color) => {
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
      for (let i = 0; i <= steps; i++) paint(x1 + (x2 - x1) * i / (steps || 1), y1 + (y2 - y1) * i / (steps || 1), 1, 1, color);
    };
    if (progress === 0) {
      paint(center - 6, py + 27, 12, 6, '#a77b53');
      if (crop.type === 'carrot') paint(center - 2, py + 24, 4, 5, '#e7bd7b');
      if (crop.type === 'potato') paint(center - 4, py + 23, 8, 6, '#c8aa7c');
      if (crop.type === 'pumpkin') { paint(center - 3, py + 24, 6, 4, '#e0c184'); paint(center - 1, py + 21, 2, 4, '#74a153'); }
      if (crop.type === 'strawberry') { paint(center - 2, py + 24, 4, 4, '#ae6156'); paint(center + 2, py + 25, 2, 3, '#ebd7a0'); }
      if (crop.type === 'corn') { paint(center - 4, py + 24, 4, 6, '#f6d46b'); paint(center + 2, py + 26, 3, 4, '#f6d46b'); }
      paint(center - 4, py + 27, 2, 1, '#f3d3a0');
      return;
    }
    if (progress === 1) {
      paint(center - 2, py + 23, 4, 15, '#5b914c');
      if (crop.type === 'carrot') { paint(center - 8, py + 19, 7, 5, '#77b758'); paint(center + 2, py + 17, 7, 5, '#69a753'); }
      if (crop.type === 'potato') { paint(center - 12, py + 23, 11, 7, '#77b758'); paint(center + 2, py + 21, 11, 7, '#69a753'); }
      if (crop.type === 'pumpkin') { paint(center - 11, py + 25, 10, 5, '#77b758'); paint(center + 2, py + 25, 10, 5, '#69a753'); paint(center - 1, py + 19, 3, 6, '#8eb75c'); }
      if (crop.type === 'strawberry') { paint(center - 11, py + 24, 10, 5, '#77b758'); paint(center + 2, py + 22, 10, 5, '#69a753'); }
      if (crop.type === 'corn') { paint(center - 8, py + 20, 7, 4, '#77b758'); paint(center + 2, py + 17, 7, 4, '#69a753'); }
      if (crop.type === 'carrot') { line(center - 7, py + 20, center - 2, py + 21, '#b5db78'); line(center + 3, py + 19, center + 8, py + 18, '#b5db78'); }
      if (crop.type === 'potato') { line(center - 8, py + 28, center + 7, py + 24, '#3c7440'); paint(center + 5, py + 22, 2, 2, '#a6cb72'); }
      if (crop.type === 'pumpkin') line(center - 10, py + 28, center + 11, py + 27, '#426e38');
      if (crop.type === 'strawberry') { paint(center - 7, py + 22, 3, 2, '#a0cb69'); paint(center + 5, py + 20, 3, 2, '#a0cb69'); }
      if (crop.type === 'corn') { paint(center - 1, py + 21, 2, 8, '#a1c66a'); line(center + 4, py + 19, center + 8, py + 17, '#b6d57a'); }
      return;
    }
    if (crop.type === 'carrot') {
      paint(center - 2, py + 13, 4, 25, '#4c853e');
      paint(center - 12, py + 17, 11, 6, '#66a94c');
      paint(center + 1, py + 14, 12, 7, '#80b951');
      paint(center - 8, py + 9, 6, 11, '#78b353');
      line(center - 8, py + 19, center - 1, py + 21, '#b4d971');
      line(center + 2, py + 17, center + 10, py + 16, '#b4d971');
      line(center - 5, py + 12, center - 4, py + 18, '#b4d971');
      if (mature) {
        paint(center - 9, py + 26, 18, 10, '#dc6b3d');
        paint(center - 7, py + 36, 14, 4, '#ed8150');
        paint(center - 4, py + 40, 8, 3, '#f1ddd0');
        paint(center - 2, py + 43, 4, 2, '#fff2db');
        paint(center - 7, py + 28, 5, 2, '#f3a06a');
      }
    } else if (crop.type === 'potato') {
      paint(center - 15, py + 24, 30, 12, '#4d8b47');
      paint(center - 11, py + 17, 13, 12, '#6fab55');
      paint(center + 1, py + 14, 14, 15, '#79b45f');
      paint(center - 4, py + 10, 8, 9, '#5c9d4c');
      line(center - 13, py + 32, center - 4, py + 24, '#3d7140');
      line(center - 4, py + 24, center + 8, py + 29, '#3d7140');
      if (mature) {
        paint(center - 16, py + 32, 13, 9, '#c9a376');
        paint(center + 3, py + 31, 14, 10, '#d8b684');
        paint(center - 11, py + 35, 2, 2, '#9a7758');
        paint(center + 9, py + 34, 2, 2, '#9a7758');
        paint(center - 6, py + 15, 4, 3, '#f7f2de'); paint(center + 7, py + 18, 4, 3, '#fff9e8');
        line(center - 12, py + 38, center - 8, py + 35, '#8c6b4f');
        line(center + 2, py + 39, center + 6, py + 37, '#8c6b4f');
      }
    } else if (crop.type === 'pumpkin') {
      paint(center - 18, py + 30, 36, 5, '#4f8541');
      paint(center - 17, py + 23, 12, 11, '#6da449');
      paint(center + 6, py + 20, 12, 12, '#76ad4d');
      paint(center - 2, py + 15, 4, 17, '#5c8739');
      line(center - 17, py + 34, center + 13, py + 31, '#426f36');
      line(center + 12, py + 29, center + 17, py + 25, '#5b8a41');
      line(center + 17, py + 25, center + 14, py + 22, '#5b8a41');
      if (mature) {
        paint(center - 17, py + 23, 34, 18, '#cd7034');
        paint(center - 12, py + 19, 24, 23, '#e6973d');
        paint(center - 4, py + 21, 8, 20, '#f3ad4d');
        paint(center - 3, py + 16, 6, 6, '#598141');
        line(center - 10, py + 23, center - 11, py + 38, '#bd6931');
        line(center + 9, py + 23, center + 10, py + 38, '#bd6931');
        paint(center + 3, py + 23, 5, 2, '#ffd07b');
      }
    } else if (crop.type === 'strawberry') {
      paint(center - 2, py + 18, 4, 20, '#568a45');
      paint(center - 16, py + 22, 14, 9, '#6aa852');
      paint(center + 2, py + 20, 15, 10, '#78b65a');
      paint(center - 10, py + 13, 9, 8, '#5e9c4b');
      paint(center - 13, py + 21, 4, 4, '#83bb5c');
      paint(center + 10, py + 20, 4, 4, '#91c569');
      paint(center - 5, py + 14, 3, 3, '#91c569');
      paint(center - 13, py + 18, 4, 3, '#83bb5c'); paint(center - 9, py + 20, 4, 3, '#83bb5c');
      paint(center + 6, py + 17, 4, 3, '#91c569'); paint(center + 10, py + 19, 4, 3, '#91c569');
      paint(center - 2, py + 11, 4, 3, '#91c569'); paint(center + 2, py + 13, 4, 3, '#91c569');
      if (mature) {
        for (const [dx, dy, color] of [[-11, 28, '#c73740'], [4, 26, '#e95151'], [-2, 33, '#d94148']]) {
          paint(center + dx, py + dy, 9, 8, color);
          paint(center + dx + 2, py + dy + 7, 5, 3, '#ee6561');
          paint(center + dx + 1, py + dy + 2, 2, 2, '#fff0bb');
          paint(center + dx + 5, py + dy + 4, 1, 2, '#ffe2a0');
          paint(center + dx + 3, py + dy + 6, 1, 1, '#ffe2a0');
        }
      }
    } else if (crop.type === 'corn') {
      paint(center - 3, py + 9, 6, 30, '#5c9149');
      paint(center - 14, py + 19, 12, 5, '#78ae55');
      paint(center + 3, py + 23, 13, 5, '#72a74d');
      paint(center - 7, py + 7, 5, 10, '#8bb65b');
      paint(center + 1, py + 10, 2, 25, '#a6c66c');
      line(center - 12, py + 22, center - 2, py + 32, '#a5ca69');
      if (mature) {
        paint(center + 4, py + 17, 10, 19, '#e9b942');
        paint(center + 6, py + 19, 6, 15, '#f8db65');
        paint(center + 3, py + 27, 3, 12, '#70a750');
        paint(center + 12, py + 25, 4, 13, '#6e9c4d');
        line(center + 2, py + 36, center + 7, py + 23, '#92bd5b');
        line(center + 16, py + 36, center + 12, py + 22, '#9fc566');
        for (let row = 0; row < 4; row++) for (let col = 0; col < 2; col++) paint(center + 6 + col * 3, py + 20 + row * 3, 2, 2, '#ffe47d');
        line(center + 8, py + 16, center + 4, py + 7, '#b38855');
        line(center + 9, py + 16, center + 13, py + 8, '#b38855');
      }
    }
  }

  function drawFarmer(now) {
    const x = FIELD_X + state.farmer.x * TILE + 9;
    const walking = now < walkingUntil;
    const frame = walking ? Math.floor(now / 65) % 4 : 0;
    const feet = [0, 2, 0, -2][frame];
    const y = FIELD_Y + state.farmer.y * TILE + 5 + (walking ? -(frame % 2) : Math.floor(now / 900) % 2);
    const facing = state.farmer.facing;
    shadow(x + 21, y + 39, 16, 5);
    box(x + 10, y + 29, 8, 7 + feet, '#775c4b');
    box(x + 23, y + 29, 8, 7 - feet, '#775c4b');
    box(x + 9, y + 35 + feet, 10, 4, '#45423f');
    box(x + 22, y + 35 - feet, 10, 4, '#45423f');
    box(x + 8, y + 20, 25, 13, facing === 'up' ? '#426f82' : '#557f9a');
    box(x + 11, y + 22, 18, 2, '#739fb2');
    box(x + 5, y + 22 + feet, 5, 10, '#edb881');
    box(x + 32, y + 22 - feet, 5, 10, '#edb881');
    box(x + 12, y + 9, 18, 14, '#e8ae7a');
    if (facing === 'up') box(x + 12, y + 11, 18, 13, '#795b45');
    box(x + 10, y + 7, 22, 6, '#795a3d');
    box(x + (facing === 'left' ? 2 : facing === 'right' ? 10 : 6), y + 4, 30, 6, '#b48b56');
    box(x + 12, y, 18, 7, '#ccaa68');
    box(x + 16, y + 2, 11, 1, '#e4c989');
    if (facing !== 'up') {
      if (facing === 'left') box(x + 13, y + 16, 3, 3, '#3c4540');
      else if (facing === 'right') box(x + 27, y + 16, 3, 3, '#3c4540');
      else {
        box(x + 16, y + 15, 3, 3, '#3c4540');
        box(x + 25, y + 15, 3, 3, '#3c4540');
        box(x + 20, y + 20, 3, 1, '#b97761');
      }
    }
    if (now >= swingUntil) {
      const tx = facing === 'left' ? x + 1 : x + 37;
      box(tx, y + 22, 2, 14, '#8a6040');
      if (state.tool === 'hoe') box(tx - 4, y + 20, 10, 3, '#b5c1bd');
      if (state.tool === 'water') { box(tx - 3, y + 27, 9, 7, '#6babb8'); box(tx + 5, y + 29, 5, 2, '#8ac9d0'); }
      if (state.tool === 'scythe') pixelLine(tx - 4, y + 21, tx + 6, y + 17, '#d8dfd2', 2);
      if (state.tool === 'seed') box(tx - 3, y + 29, 8, 6, '#d4ad65');
    } else {
      const phase = Math.min(2, Math.floor((200 - (swingUntil - now)) / 67));
      const side = facing === 'left' ? -1 : 1;
      const tx = (facing === 'left' ? x - 5 : facing === 'right' ? x + 37 : x + 31) + (swingTool === 'scythe' ? [-6, 8, 1][phase] * side : 0);
      const ty = y + [2, 17, 9][phase] + (swingTool === 'hoe' ? [-6, 4, 0][phase] : 0);
      if (swingTool === 'water') {
        box(tx - 5, ty + 6, 12, 9, '#6babb8'); box(tx - 3, ty + 8, 7, 3, '#9bd4d7');
        pixelLine(tx - 3, ty + 6, tx + 4, ty + 2, '#b7d4ce', 2);
        box(tx + side * 7, ty + (phase === 1 ? 13 : 9), 7, 3, '#8ac9d0');
      } else {
        pixelLine(tx, ty, tx + side * (swingTool === 'hoe' ? 7 : 4), ty + 18, '#8a6040', 3);
        if (swingTool === 'hoe') box(tx - 6, ty - 2, 15, 4, '#b5c1bd');
        else { pixelLine(tx - side * 7, ty + 2, tx + side * 6, ty - 5, '#d8dfd2', 2); box(tx - side * 7, ty + 2, 3, 3, '#bdc9c3'); }
      }
    }
  }

  function drawScene(now) {
    drawBackground(now);
    drawHouse();
    drawPond(now);
    drawTree(37, 274, now);
    drawTree(685, 111, now);
    drawTree(694, 380, now);
    for (let y = 0; y < F.HEIGHT; y++) {
      for (let x = 0; x < F.WIDTH; x++) drawPlot(state.plots[y][x], x, y);
    }
    const front = F.frontCell(state);
    if (front.x >= 0 && front.y >= 0 && front.x < F.WIDTH && front.y < F.HEIGHT) {
      const px = FIELD_X + front.x * TILE, py = FIELD_Y + front.y * TILE;
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(now / 350);
      box(px + 3, py + 2, 42, 3, '#fff0aa');
      box(px + 3, py + 43, 42, 3, '#fff0aa');
      box(px + 2, py + 3, 3, 40, '#fff0aa');
      box(px + 43, py + 3, 3, 40, '#fff0aa');
      ctx.globalAlpha = 1;
    }
    if (shake && now < shake.until) {
      const px = FIELD_X + shake.x * TILE, py = FIELD_Y + shake.y * TILE;
      ctx.strokeStyle = '#d06b50';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + (Math.floor(now / 25) % 2 ? 2 : -2) + 3, py + 3, 42, 42);
    }
    drawFarmer(now);
    if (waterArc && now < waterArc.until) {
      for (let i = 0; i < 9; i++) {
        const t = i / 8;
        const x = waterArc.x + (waterArc.toX - waterArc.x) * t;
        const y = waterArc.y + (waterArc.toY - waterArc.y) * t - 16 * Math.sin(t * Math.PI);
        box(x, y, 2, 3, '#89dcea');
      }
    }
    for (const particle of particles) {
      ctx.globalAlpha = particle.kind === 'smoke' || particle.kind === 'star' || particle.kind === 'splash' ? Math.max(0, 1 - particle.age / particle.life) : 1;
      if (particle.kind === 'text') label('+1', particle.x - 9, particle.y, particle.color, 15);
      else if (particle.kind === 'harvest') {
        const t = particle.age / particle.life;
        const x = t < 0.22 ? particle.x : particle.x + (700 - particle.x) * ((t - 0.22) / 0.78);
        const y = t < 0.22 ? particle.y - 11 * Math.sin(t / 0.22 * Math.PI) : particle.y + (25 - particle.y) * ((t - 0.22) / 0.78) - 17 * Math.sin((t - 0.22) / 0.78 * Math.PI);
        const size = Math.max(1, 7 * (1 - t));
        ctx.save(); ctx.translate(x, y); ctx.rotate(t * Math.PI * 4); box(-size / 2, -size / 2, size, size, particle.color); ctx.restore();
      } else if (particle.kind === 'star') {
        box(particle.x - 3, particle.y, 7, 1, particle.color);
        box(particle.x, particle.y - 3, 1, 7, particle.color);
      } else if (particle.kind === 'rain') {
        pixelLine(particle.x, particle.y, particle.x - 3, particle.y + 10, particle.color);
      } else if (particle.kind === 'snow') box(particle.x, particle.y, 3, 3, particle.color);
      else if (particle.kind === 'splash') { box(particle.x - 2, particle.y, 2, 2, particle.color); box(particle.x + 2, particle.y, 2, 2, particle.color); }
      else box(particle.x, particle.y, particle.kind === 'smoke' ? 8 : particle.kind === 'drop' ? 3 : 4, particle.kind === 'smoke' ? 6 : particle.kind === 'drop' ? 5 : 4, particle.color);
    }
    ctx.globalAlpha = 1;
    if (sleepStart) {
      const elapsed = now - sleepStart;
      const alpha = elapsed < 500 ? elapsed / 500 : elapsed < 900 ? 1 : 1 - (elapsed - 900) / 500;
      ctx.fillStyle = `rgba(17, 30, 68, ${Math.max(0, Math.min(0.72, alpha * 0.72))})`;
      ctx.fillRect(0, 0, 768, 576);
      if (elapsed >= 500 && elapsed < 1300) {
        for (let i = 0; i < 20; i++) {
          ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(now / 270 + i * 2.3));
          box(15 + hash(i, 3, 91) * 735, 8 + hash(i, 7, 92) * 450, 2, 2, '#fff4cf');
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  function render() {
    document.getElementById('date').textContent = `${F.season(state)} · 第 ${F.seasonDay(state)} 天`;
    document.getElementById('weather').textContent = state.weather === 'rain' ? '☂ 雨天' : '☀ 晴天';
    document.getElementById('tomorrow').textContent = `明日：${state.tomorrow === 'rain' ? '雨' : '晴'}`;
    document.getElementById('gold').textContent = `${Math.round(goldDisplay)} G`;
    document.getElementById('energy-text').textContent = `${state.energy} / ${F.ENERGY_MAX}`;
    document.getElementById('energy-fill').style.width = `${state.energy / F.ENERGY_MAX * 100}%`;
    document.getElementById('tools').innerHTML = keys.map((key, i) =>
      `<button type="button" class="tool ${state.tool === key ? 'active' : ''} ${toolBounce === key && performance.now() < bounceUntil ? 'bump' : ''}" data-tool="${key}" aria-pressed="${state.tool === key}"><span class="tool-icon">${icons[key]}${state.upgrades[key] ? '✦' : ''}</span><span>${state.upgrades[key] ? (key === 'hoe' ? '精钢锄' : '铁水壶') : F.TOOLS[key].name}</span><small>${i + 1}</small></button>`
    ).join('');
    document.getElementById('crop-options').innerHTML = '<span>播种：</span>' + Object.entries(F.CROPS).map(([key, crop]) =>
      `<button type="button" class="crop-choice ${state.selectedCrop === key ? 'active' : ''}" data-crop="${key}" aria-pressed="${state.selectedCrop === key}">${crop.name} × ${state.seeds[key]}</button>`
    ).join('');
    document.getElementById('bag').innerHTML = Object.entries(F.CROPS).map(([key, crop]) =>
      `<div class="bag-row"><span><i class="crop-dot" style="background:${cropColors[key]}"></i>${crop.name}</span><strong>× ${state.bag[key]}</strong></div>`
    ).join('') + `<div class="bag-row"><span>饭团</span><button type="button" data-eat="snack">吃掉 × ${state.snacks}</button></div>`;
    document.getElementById('shop').innerHTML = Object.entries(F.CROPS).map(([key, crop]) =>
      `<div class="shop-row"><span><i class="crop-dot" style="background:${cropColors[key]}"></i>${crop.name}<small>${crop.days} 天 · 售 ${crop.sellPrice} G</small></span><button type="button" data-buy="${key}">买种子 ${crop.seedPrice} G</button></div>`
    ).join('') + `<div class="shop-row"><span>精钢锄<small>锄地体力减半</small></span><button type="button" data-upgrade="hoe" ${state.upgrades.hoe ? 'disabled' : ''}>${state.upgrades.hoe ? '已购买' : '400 G'}</button></div><div class="shop-row"><span>铁水壶<small>面前三格浇水</small></span><button type="button" data-upgrade="water" ${state.upgrades.water ? 'disabled' : ''}>${state.upgrades.water ? '已购买' : '600 G'}</button></div><div class="shop-row"><span>饭团<small>恢复 15 体力</small></span><button type="button" data-snack="buy">20 G</button></div>`;
    document.getElementById('log').innerHTML = journal.map(item => `<li>${item}</li>`).join('');
    document.getElementById('orders-list').innerHTML = state.orders.length ? state.orders.map(order => `<div class="order-row"><span>${F.CROPS[order.crop].name} × ${order.amount} · 第 ${order.deadline} 天前<br>奖励 ${order.reward} G · 背包 ${state.bag[order.crop]}</span><button type="button" data-deliver="${order.id}">交付</button></div>`).join('') : '<p>今日没有订单，睡觉后刷新。</p>';
    document.getElementById('stats-list').innerHTML = `<p>累计收入：${state.stats.income} G</p><p>累计收获：${state.stats.harvested}</p><p>完成订单：${state.stats.orders}</p><p>已玩天数：${state.stats.days}</p>`;
    drawScene(performance.now());
  }

  function frame(now) {
    const dt = Math.min(50, now - (lastFrame || now));
    lastFrame = now;
    tickInput(now);
    if (waterArc && now >= waterArc.until) {
      for (let i = 0; i < 5; i++) addParticle(waterArc.toX + (i - 2) * 5, waterArc.toY, (i - 2) * 0.055, -0.15 - i * 0.018, 300, '#75d8ed', 'drop');
      waterArc = null;
    }
    if (route.length && !input.direction && now >= routeNext) {
      move(route.shift());
      routeNext = now + 140;
      if (!route.length) handle({ ok: true, message: '已走到目标地块旁', events: [] }, false);
    }
    for (const particle of particles) {
      particle.age += dt;
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      if (particle.kind === 'drop') particle.vy += 0.0018 * dt;
      if (particle.kind === 'snow') particle.x += Math.sin(now / 240 + particle.y) * 0.4;
      if (particle.kind === 'rain' && particle.y > 540) { particle.age = particle.life; addParticle(particle.x, 541, 0, 0, 120, '#d8efec', 'splash'); }
      if (particle.kind === 'snow' && particle.y > 540) particle.age = particle.life;
    }
    particles = particles.filter(particle => particle.age < particle.life);
    if (now - lastSmoke > 350) {
      addParticle(19, 117, 0.025, -0.06, 850, '#f7f4e590', 'smoke');
      lastSmoke = now;
    }
    if ((state.weather === 'rain' || F.season(state) === '冬') && now - lastRain > 35) {
      const snow = F.season(state) === '冬';
      for (let i = 0; i < 2; i++) addParticle((now * 3 + i * 251) % 768, -10 - i * 120, snow ? 0 : -0.25, snow ? 0.14 : 0.85, snow ? 4500 : 850, snow ? '#f5f8edc9' : '#b7e5e8a0', snow ? 'snow' : 'rain');
      lastRain = now;
    }
    if (now - lastSpark >= 900) {
      const mature = [];
      for (let y = 0; y < F.HEIGHT; y++) for (let x = 0; x < F.WIDTH; x++) {
        const crop = state.plots[y][x].crop;
        if (crop && crop.progress >= F.CROPS[crop.type].days) mature.push([x, y]);
      }
      if (mature.length) {
        const [x, y] = mature[Math.floor(hash(now, mature.length, 96) * mature.length)];
        addParticle(FIELD_X + x * TILE + 13 + hash(now, x, 97) * 22, FIELD_Y + y * TILE + 8, 0, -0.012, 420, '#fff1ad', 'star');
      }
      lastSpark = now;
    }
    if (sleepPending && now - sleepStart >= 500) {
      sleepPending = false;
      const outcome = F.sleep(state);
      if (state.weather === 'rain') sound('rain');
      handle(outcome, true);
    }
    if (sleepStart && now - sleepStart >= 1400) sleepStart = 0;
    if (goldStart) {
      const t = Math.min(1, (now - goldStart) / 300);
      goldDisplay = Math.round(goldFrom + (state.gold - goldFrom) * (1 - Math.pow(1 - t, 3)));
      document.getElementById('gold').textContent = `${goldDisplay} G`;
      if (t === 1) goldStart = 0;
    }
    const gold = document.getElementById('gold');
    gold.style.transform = now < goldUntil ? `scale(${1 + 0.25 * Math.sin((goldUntil - now) / 500 * Math.PI)})` : '';
    drawScene(now);
    if (!document.hidden) requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { lastFrame = 0; requestAnimationFrame(frame); }
  });

  function selectTool(key) {
    initAudio();
    const outcome = F.selectTool(state, key);
    if (outcome.ok) { toolBounce = key; bounceUntil = performance.now() + 280; }
    handle(outcome, true);
  }

  function openCodex() {
    const list = document.getElementById('codex-list');
    const sorted = Object.entries(F.CROPS).sort((a, b) => b[1].sellPrice / b[1].seedPrice - a[1].sellPrice / a[1].seedPrice);
    list.innerHTML = sorted.map(([key, crop]) => `<div class="codex-row"><canvas width="48" height="48" data-preview="${key}"></canvas><div><strong>${crop.name}</strong>${crop.days} 天 · 种子 ${crop.seedPrice} G · 售价 ${crop.sellPrice} G · 每 G 投入回收 ${(crop.sellPrice / crop.seedPrice).toFixed(2)} G</div></div>`).join('');
    for (const preview of list.querySelectorAll('canvas')) {
      const context = preview.getContext('2d');
      context.imageSmoothingEnabled = false;
      context.fillStyle = '#8a6249';
      context.fillRect(0, 0, 48, 48);
      drawCrop(context, { type: preview.dataset.preview, progress: F.CROPS[preview.dataset.preview].days }, 0, 0, 0);
    }
    document.getElementById('codex-panel').hidden = false;
    document.getElementById('orders-panel').hidden = true;
    document.body.classList.add('modal-open');
  }

  function closePanels() {
    document.getElementById('codex-panel').hidden = true;
    document.getElementById('orders-panel').hidden = true;
    document.body.classList.remove('modal-open');
  }

  const directionKeys = { w: 'up', ArrowUp: 'up', s: 'down', ArrowDown: 'down', a: 'left', ArrowLeft: 'left', d: 'right', ArrowRight: 'right' };
  document.addEventListener('keydown', event => {
    if (!document.getElementById('codex-panel').hidden || !document.getElementById('orders-panel').hidden) {
      if (event.key === 'Escape') closePanels();
      return;
    }
    const direction = directionKeys[event.key];
    if (direction) { event.preventDefault(); pressDirection(direction, `key:${event.key}`); return; }
    if (event.key >= '1' && event.key <= '4') { selectTool(keys[Number(event.key) - 1]); return; }
    if (event.key === ' ' || event.key === 'Enter') {
      if (event.target instanceof HTMLButtonElement) return;
      event.preventDefault();
      pressUse();
    }
  });
  document.addEventListener('keyup', event => {
    if (directionKeys[event.key]) releaseDirection(`key:${event.key}`);
    if (event.key === ' ' || event.key === 'Enter') input.use = false;
  });
  window.addEventListener('blur', () => { input.direction = null; input.use = false; route = []; });
  document.getElementById('tools').addEventListener('click', event => {
    const button = event.target.closest('[data-tool]');
    if (button) selectTool(button.dataset.tool);
  });
  document.getElementById('crop-options').addEventListener('click', event => {
    const button = event.target.closest('[data-crop]');
    if (button) { initAudio(); handle(F.selectCrop(state, button.dataset.crop), true); }
  });
  document.getElementById('shop').addEventListener('click', event => {
    const button = event.target.closest('[data-buy]');
    if (button) { initAudio(); const outcome = F.buySeed(state, button.dataset.buy, 1); if (!outcome.ok) sound('error'); handle(outcome, true); }
    const upgrade = event.target.closest('[data-upgrade]');
    if (upgrade) { const outcome = F.buyUpgrade(state, upgrade.dataset.upgrade); if (!outcome.ok) sound('error'); handle(outcome, true); }
    if (event.target.closest('[data-snack]')) { const outcome = F.buySnack(state); if (!outcome.ok) sound('error'); handle(outcome, true); }
  });
  document.getElementById('bag').addEventListener('click', event => {
    if (event.target.closest('[data-eat]')) { const outcome = F.eatSnack(state); if (!outcome.ok) sound('error'); handle(outcome, true); }
  });
  document.getElementById('sell-all').addEventListener('click', () => {
    initAudio();
    const outcome = F.sellAll(state);
    if (outcome.ok) { goldUntil = performance.now() + 500; sound('sell'); }
    else sound('error');
    handle(outcome, true);
  });
  document.getElementById('sleep').addEventListener('click', () => {
    initAudio();
    if (!sleepStart) { sleepStart = performance.now(); sleepPending = true; }
  });
  document.querySelector('.dpad').addEventListener('pointerdown', event => {
    const button = event.target.closest('[data-direction]');
    if (button) { event.preventDefault(); button.setPointerCapture?.(event.pointerId); pressDirection(button.dataset.direction, `pointer:${event.pointerId}`); }
  });
  document.querySelector('.dpad').addEventListener('pointerup', event => releaseDirection(`pointer:${event.pointerId}`));
  document.querySelector('.dpad').addEventListener('pointercancel', event => releaseDirection(`pointer:${event.pointerId}`));
  document.getElementById('touch-use').addEventListener('pointerdown', event => { event.preventDefault(); event.currentTarget.setPointerCapture?.(event.pointerId); pressUse(); });
  document.getElementById('touch-use').addEventListener('pointerup', () => { input.use = false; });
  document.getElementById('touch-use').addEventListener('pointercancel', () => { input.use = false; });
  canvas.addEventListener('pointerdown', event => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(((event.clientX - rect.left) / rect.width * 768 - FIELD_X) / TILE);
    const y = Math.floor(((event.clientY - rect.top) / rect.height * 576 - FIELD_Y) / TILE);
    if (x < 0 || x >= F.WIDTH || y < 0 || y >= F.HEIGHT) return;
    input.direction = null;
    route = [];
    const distance = Math.abs(x - state.farmer.x) + Math.abs(y - state.farmer.y);
    if (distance === 1) {
      state.farmer.facing = Object.entries(F.DIRECTIONS).find(([, [dx, dy]]) => state.farmer.x + dx === x && state.farmer.y + dy === y)[0];
      action();
      return;
    }
    if (distance === 0) return;
    const path = F.findPath(state, x, y);
    if (!path) { sound('error'); handle({ ok: false, message: '没有通往目标地块旁的路', events: [] }, false); return; }
    route = path;
    routeNext = performance.now();
  });
  document.getElementById('farm').addEventListener('touchmove', event => event.preventDefault(), { passive: false });
  document.getElementById('mute').addEventListener('click', () => {
    initAudio();
    muted = !muted;
    try { localStorage.setItem('pocket-farm-muted', String(muted)); } catch (_) { /* 存储不可用 */ }
    updateMute();
  });
  function updateMute() {
    const button = document.getElementById('mute');
    button.textContent = muted ? '🔇 静音' : '🔊 音效';
    button.setAttribute('aria-pressed', String(muted));
  }
  document.getElementById('codex').addEventListener('click', () => { initAudio(); openCodex(); });
  document.getElementById('orders-button').addEventListener('click', () => { initAudio(); document.getElementById('orders-panel').hidden = false; document.getElementById('codex-panel').hidden = true; document.body.classList.add('modal-open'); });
  document.getElementById('orders-list').addEventListener('click', event => {
    const button = event.target.closest('[data-deliver]');
    if (button) { const outcome = F.deliverOrder(state, Number(button.dataset.deliver)); if (!outcome.ok) sound('error'); else sound('sell'); handle(outcome, true); }
  });
  document.getElementById('close-codex').addEventListener('click', closePanels);
  document.getElementById('close-orders').addEventListener('click', closePanels);
  document.getElementById('crop-tab').addEventListener('click', () => { document.getElementById('codex-list').hidden = false; document.getElementById('stats-list').hidden = true; });
  document.getElementById('stats-tab').addEventListener('click', () => { document.getElementById('codex-list').hidden = true; document.getElementById('stats-list').hidden = false; });
  document.getElementById('codex-panel').addEventListener('click', event => {
    if (event.target.id === 'codex-panel') closePanels();
  });
  document.getElementById('orders-panel').addEventListener('click', event => { if (event.target.id === 'orders-panel') closePanels(); });
  document.getElementById('new-game').addEventListener('click', () => {
    if (!confirm('开始新游戏？当前农场进度会被覆盖。')) return;
    sleepStart = 0;
    sleepPending = false;
    particles = [];
    route = [];
    input.direction = null;
    input.use = false;
    state = F.createGame();
    goldDisplay = state.gold;
    goldStart = 0;
    journal = ['新的农场生活开始了！'];
    handle({ ok: true, message: '新游戏已开始', events: [] }, true);
  });
  document.getElementById('hint').textContent = '用 WASD 或方向键移动；面向地块，按空格或回车使用当前工具。';
  updateMute();
  render();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
